<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>音乐播放器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#121212;color:#fff;max-width:600px;margin:40px auto;padding:20px}
        .title{font-size:24px;margin-bottom:20px;text-align:center}
        audio{width:100%;margin:15px 0}
        .list{margin-top:30px}
        .item{padding:12px 16px;background:#222;margin:8px 0;border-radius:8px;cursor:pointer}
        .item:hover{background:#333}
        .item.active{background:#2a4060}
    </style>
</head>
<body>
    <h2 class="title">简易播放器</h2>
    <audio id="audio" controls>
    <div class="list" id="songList"></div>

<script>
// ============【在这里添加歌曲，以后新增就在这里复制模板】============
const songs = [
    {
        name: "演员",
        src: "music/yanyuan.mp3"
    }
    // 新增歌曲模板，复制下面这段，修改名字和文件路径即可
    /*
    ,{
        name: "歌曲名称",
        src: "music/xxx.mp3"
    }
    */
];
// ==================================================================

const audio = document.getElementById('audio');
const listBox = document.getElementById('songList');

// 渲染歌单
songs.forEach((song,index)=>{
    let div = document.createElement('div');
    div.className = "item";
    div.innerText = song.name;
    div.onclick = ()=>{
        audio.src = song.src;
        audio.play();
        // 高亮当前播放
        document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'))
        div.classList.add('active')
    }
    listBox.appendChild(div);
})
</script>
</body>
</html>
