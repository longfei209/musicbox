<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>传奇 · 黑白 · 全屏版</title>
<style>
:root{
  --bg:#0a0a0a; --panel:#151515; --panel2:#1e1e1e; --panel3:#262626;
  --line:#333; --line2:#444;
  --tx:#e8e8e8; --tx2:#aaa; --tx3:#777;
  --q1:#888; --q2:#aaa; --q3:#ddd; --q4:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:720px;margin:0 auto;height:100vh;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

.btn{display:block;width:100%;padding:9px;margin:3px 0;background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:4px;text-align:center;transition:.12s;font-size:13px;}
.btn:active{background:#2e2e2e;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.primary{background:#2a2a2a;border-color:#666;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--tx2);}
.btn.danger{border-color:#5a2a2a;color:#d99;}
.btn.warn{border-color:#7a5a2a;color:#e8a;}
.btn.sm{padding:6px 8px;font-size:12px;margin:2px 0;}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.row .btn{flex:1;min-width:0;}

.dim{color:var(--tx3);}
.q-normal{color:var(--q1);}
.q-good{color:var(--q2);}
.q-fine{color:var(--q3);}
.q-epic{color:var(--q4);font-weight:700;}
.q-epic::before{content:"★ ";}

.bar{height:12px;background:#0e0e0e;border:1px solid var(--line2);border-radius:3px;overflow:hidden;position:relative;}
.bar>i{display:block;height:100%;background:#e0e0e0;transition:width .18s;}
.bar>.txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff;}
.bar.mp>i{background:#8a8a9a;}
.bar.mon>i{background:#999;}
.bar.exp>i{background:#777;}

/* ===== 页面容器 ===== */
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.page{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.page.hidden{display:none;}

.page-header{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;background:var(--panel);}
.page-header .title{font-weight:600;}
.page-header .nav{display:flex;gap:4px;}
.page-header .nav button{padding:4px 10px;border:1px solid var(--line2);border-radius:4px;font-size:13px;}
.page-header .nav button:active{background:var(--panel3);}

.page-body{flex:1;overflow:hidden;padding:8px 10px;display:flex;flex-direction:column;min-height:0;}
.page-body.scrollable{overflow-y:auto;}
.page-body.scrollable::-webkit-scrollbar{width:0;}

/* 分页 */
.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 0;font-size:12px;color:var(--tx2);}
.pager button{padding:4px 12px;border:1px solid var(--line2);border-radius:4px;font-size:12px;}
.pager button:disabled{opacity:.3;}

/* ===== 主页顶栏 ===== */
.hud{padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;}
.hud .hud-row{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px;align-items:center;}
.hud .hud-row:last-child{margin-bottom:0;}
.hud .bars{display:flex;gap:4px;}
.hud .bars .bar{flex:1;}
.hud .stats{display:flex;gap:8px;font-size:11px;color:var(--tx2);}
.hud .stats b{color:var(--tx);}

/* 主页主内容 */
.home-body{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:5px;overflow:hidden;min-height:0;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.menu-grid .btn{margin:0;}

.floor-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx2);padding:2px 0;}
.groups-row{display:flex;gap:5px;}
.groups-row .group-btn{flex:1;min-width:0;margin:0;padding:9px 2px;font-size:12px;}
.group-btn.dead{opacity:.4;}

.boss-block{border:1px solid #555;background:var(--panel2);border-radius:5px;padding:7px;font-size:12px;}
.boss-block .boss-name{font-size:13px;margin-bottom:3px;}
.boss-block .boss-meta{font-size:11px;color:var(--tx3);margin-bottom:5px;}
.boss-block .btn{margin:0;padding:7px;font-size:12px;}

/* ===== 列表卡片（商店/背包/任务） ===== */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px;margin:0;font-size:12px;display:flex;flex-direction:column;}
.card .card-title{font-size:13px;margin-bottom:2px;}
.card .card-meta{font-size:11px;color:var(--tx3);margin-bottom:4px;}
.card .card-actions{display:flex;gap:4px;flex-wrap:wrap;}
.card .card-actions .btn{flex:1;min-width:0;margin:0;padding:5px 4px;font-size:11px;}
.cards-list{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;}

/* ===== 战斗界面 ===== */
#battlePage{background:var(--bg);}
.b-field{flex:1;display:flex;min-height:0;}
.b-left{width:35%;padding:8px 6px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;align-items:center;background:var(--panel);position:relative;overflow:hidden;}
.b-left .p-avatar{font-size:30px;filter:grayscale(1);line-height:1;}
.b-left .p-name{font-size:12px;color:var(--tx2);}
.b-left .bar{width:100%;}
.b-left .p-stats{font-size:10px;color:var(--tx3);text-align:center;line-height:1.4;}
.b-left .buff-tag{font-size:10px;color:#e0e0e0;border:1px solid #666;border-radius:3px;padding:1px 4px;}
.b-left .rage-line{font-size:10px;color:var(--tx3);}

.b-right{width:65%;padding:6px;overflow:hidden;display:flex;flex-direction:column;}
.b-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:1;min-height:0;align-content:start;}

.mon-unit{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 5px;cursor:pointer;transition:.1s;display:flex;flex-direction:column;height:60px;overflow:hidden;}
.mon-unit:active{background:#2a2a2a;}
.mon-unit.dead{opacity:.25;pointer-events:none;}
.mon-unit.elite{border-color:#666;}
.mon-unit.boss{border-color:#888;background:var(--panel3);}
.mon-unit .m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:2px;gap:2px;line-height:1.2;}
.mon-unit .m-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.mon-unit .m-bar{height:9px;margin-top:auto;}
.mon-unit .m-info{font-size:9px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}

.b-ctrl{padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--panel);}
.b-ctrl .tip{font-size:11px;color:var(--tx3);min-height:14px;margin-bottom:4px;text-align:center;}
.b-ctrl .row{margin-bottom:4px;}
.b-ctrl .row:last-child{margin-bottom:0;}
.b-ctrl .btn{margin:0;padding:7px 4px;font-size:12px;}

/* 掉落提示 */
.b-drop{position:absolute;top:38px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #555;border-radius:20px;padding:5px 14px;font-size:12px;color:#fff;opacity:0;pointer-events:none;transition:.3s;z-index:130;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;}
.b-drop.on{opacity:1;}

/* 飘字 */
.float-text{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:17px;pointer-events:none;z-index:500;animation:floatUp 1.05s ease-out forwards;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap;}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
  15%{opacity:1;transform:translate(-50%,-70%) scale(1.15);}
  35%{transform:translate(-50%,-90%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-180%) scale(.9);}
}

/* Toast / Confirm */
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#eee;border:1px solid #444;padding:7px 14px;border-radius:20px;font-size:12px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;}
#toast.on{opacity:1;}
#confirm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;}
#confirm.hidden{display:none;}
#confirm .box{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:14px;max-width:320px;width:100%;}
#confirm .msg{font-size:13px;margin-bottom:12px;}

.pet-mini{font-size:10px;}
</style>
</head>

<script>
/* ============================================================
 *  工具
 * ============================================================ */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString('en-US');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1600);
}
function confirmBox(msg, onYes){
  $('cfmMsg').textContent = msg;
  const box = $('confirm'); box.classList.remove('hidden');
  const yes = $('cfmYes'), no = $('cfmNo');
  const close = ()=>{ box.classList.add('hidden'); yes.onclick=null; no.onclick=null; };
  yes.onclick = ()=>{ close(); onYes && onYes(); };
  no.onclick  = ()=>{ close(); };
}
function floatText(targetEl, text, color){
  if(!targetEl) return;
  const r = targetEl.getBoundingClientRect();
  const div = document.createElement('div');
  div.className = 'float-text';
  div.textContent = text;
  div.style.color = color;
  div.style.left = (r.left + r.width/2) + 'px';
  div.style.top = (r.top + r.height/2) + 'px';
  document.body.appendChild(div);
  setTimeout(()=>{ if(div.parentNode) div.parentNode.removeChild(div); }, 1100);
}

const Game = {

function initGame(){
  Game.player = {
    lv:1, exp:0, hp:100, maxHp:100, mp:50, maxMp:50,
    baseAtk:10, baseDef:5, baseSpd:10,
    gold:100, potion:5, potionMp:3, bagMax:30, rage:0
  };
  Game.bag = [];
  Game.worn = { weapon:null, helmet:null, cloth:null, shoe:null, belt:null, ring:null, neck:null };
  Game.mat = 0;
  Game.areaState = {};
  Game.flags = { dragonCity:false };
  Game.quest = { doing:[], avail:[], refreshTs: Date.now() - QUEST_POOL_CD - 1000 };
  Game.ui = { areaId:null, floorIdx:null };
  Game.battle = null; Game.pet = null;
  Game.stats = { kills:0, deaths:0 };
  Quest.refreshPool(true);
}

function rollQuality(boost){
  const r = Math.random();
  const epicC = 0.03 + (boost||0);
  const fineC = 0.15 + (boost||0);
  const goodC = 0.40 + (boost||0)*1.5;
  if(r < epicC) return 'epic';
  if(r < fineC) return 'fine';
  if(r < goodC) return 'good';
  return 'normal';
}
function makeEquip(name, quality){
  const base = EQUIP_BASE[name];
  const eq = {
    uid: uid(), name, slot: base.slot,
    baseAtk: base.atk, baseDef: base.def, baseSpd: base.spd||0, baseHp: base.hp||0,
    quality: quality || rollQuality(),
    refineAtk:0, refineDef:0, refineHp:0, refineTimes:0,
    affix:null, affixVal:0
  };
  if(Math.random() < 0.25){
    const a = pick(AFFIXES);
    const v = a.roll();
    eq.affix = a.k; eq.affixVal = v; a.apply(eq, v);
  }
  return eq;
}
function equipStat(eq){
  const r = QUALITY[eq.quality].rate;
  return {
    atk: Math.floor((eq.baseAtk + eq.refineAtk) * (1 + r)),
    def: Math.floor((eq.baseDef + eq.refineDef) * (1 + r)),
    spd: Math.floor((eq.baseSpd||0) * (1 + r*0.5)) + (eq.affixSpd||0),
    hp:  (eq.baseHp||0) + eq.refineHp + (eq.affixHp||0)
  };
}
function equipAffixDesc(eq){
  if(!eq.affix) return '';
  const a = AFFIXES.find(x=>x.k===eq.affix);
  return a ? a.desc(eq.affixVal) : '';
}
function calcAttr(){
  let atk = Game.player.baseAtk, def = Game.player.baseDef, spd = Game.player.baseSpd, addHp = 0;
  let crit = 0.12, critD = 1.3, ls = 0;
  for(const s in Game.worn){
    const e = Game.worn[s]; if(!e) continue;
    const t = equipStat(e);
    atk += t.atk; def += t.def; spd += t.spd; addHp += t.hp;
    if(e.affixCrit) crit += e.affixCrit/100;
    if(e.affixCritD) critD += e.affixCritD/100;
    if(e.affixLs) ls += e.affixLs/100;
  }
  for(const sk in SETS){
    const set = SETS[sk];
    let cnt = 0;
    set.members.forEach(nm=>{
      for(const s in Game.worn){ if(Game.worn[s] && Game.worn[s].name === nm){ cnt++; break; } }
    });
    if(cnt>=3 && set.bonus3){ atk += set.bonus3.atk||0; def += set.bonus3.def||0; }
    if(cnt>=4 && set.bonus4){ atk += set.bonus4.atk||0; def += set.bonus4.def||0; addHp += set.bonus4.hp||0; spd += set.bonus4.spd||0; }
    if(cnt>=2 && set.bonus2){ atk += set.bonus2.atk||0; def += set.bonus2.def||0; spd += set.bonus2.spd||0; }
  }
  if(Game.pet && Game.pet.alive !== false){
    const pst = petStat();
    atk += pst.pAtk||0; def += pst.pDef||0; spd += pst.pSpd||0;
  }
  return { atk, def, spd, addHp, crit, critD, ls };
}
function playerMaxHp(){ return Game.player.maxHp + calcAttr().addHp; }
function playerMaxMp(){ return Game.player.maxMp; }

function addExp(v){
  const p = Game.player;
  p.exp += v;
  let leveled = false;
  while(p.exp >= p.lv * 120){
    p.exp -= p.lv * 120;
    p.lv++;
    p.baseAtk += 4; p.baseDef += 2; p.maxHp += 25; p.baseSpd += 1; p.maxMp += 8;
    leveled = true;
  }
  if(leveled){ p.hp = playerMaxHp(); p.mp = playerMaxMp(); toast("升级！Lv." + p.lv); Save.auto(); }
  Render.top();
}

function areaState(id){
  if(!Game.areaState[id]){
    const def = AREA_MAP[id];
    Game.areaState[id] = {
      floors: def.floors.map(()=>({ mark:false, groups:[], bossDeath:0, spawned:false }))
    };
  }
  return Game.areaState[id];
}

function spawnFloor(areaId, fi){
  const ar = AREA_MAP[areaId];
  const st = areaState(areaId).floors[fi];
  const pool = ar.floors[fi].pool;
  st.groups = [];
  for(let g=0; g<GROUPS_PER_FLOOR; g++){
    const count = rnd(1,4);  // 1~4 等概率
    const members = [];
    for(let i=0;i<count;i++){
      const proto = pick(pool);
      const isElite = Math.random() < ELITE_CHANCE;
      const m = {
        mid: uid(), protoId: proto.id, name: proto.name,
        hp: proto.hp, maxHp: proto.hp,
        atk: proto.atk, def: proto.def, spd: proto.spd,
        exp: proto.exp, gMin: proto.gMin, gMax: proto.gMax,
        behavior: proto.behavior,
        elite: isElite, affixes: [],
        dead: false, deathTs: 0, vamp: 0, pois: 0
      };
      if(isElite){
        m.name = "精英·" + m.name;
        m.hp = Math.floor(m.hp*1.6); m.maxHp = m.hp;
        m.atk = Math.floor(m.atk*1.3);
        m.def = Math.floor(m.def*1.3);
        m.exp = Math.floor(m.exp*1.8);
        m.gMin = Math.floor(m.gMin*2); m.gMax = Math.floor(m.gMax*2);
        const n = rnd(1,2);
        const chosen = [...ELITE_AFFIXES].sort(()=>Math.random()-0.5).slice(0, n);
        chosen.forEach(af=>{ af.apply(m); m.affixes.push(af.k); });
      }
      members.push(m);
    }
    st.groups.push({ gid: uid(), members, cleared:false });
  }
  st.spawned = true;
}
function tickRespawn(areaId, fi){
  const st = areaState(areaId).floors[fi];
  const now = Date.now();
  st.groups.forEach(g=>{
    g.members.forEach(m=>{
      if(m.dead && now - m.deathTs >= RESPAWN_MON){
        m.dead = false; m.hp = m.maxHp; g.cleared = false;
      }
    });
  });
  if(st.bossDeath && now - st.bossDeath >= RESPAWN_BOSS) st.bossDeath = 0;
  if(!st.mark && st.spawned && st.groups.every(g=>g.members.every(m=>m.dead))) st.mark = true;
}
function groupDeadTs(g){
  // 返回组内最后一只怪死亡时间戳
  let ts = 0;
  g.members.forEach(m=>{ if(m.deathTs > ts) ts = m.deathTs; });
  return ts;
}
function groupAllDead(g){
  return g.members.every(m=>m.dead);
}
function groupRespawnLeft(g){
  const ts = groupDeadTs(g);
  if(!ts) return 0;
  const left = Math.ceil((ts + RESPAWN_MON - Date.now())/1000);
  return Math.max(0, left);
}

/* ---- 宠物 ---- */
function makePet(tplKey, quality){
  const t = PET_TEMPLATES[tplKey];
  return {
    tpl: tplKey, name: t.name, avatar: t.avatar,
    quality, lv:1, exp:0,
    baseAtk: t.base.atk, baseDef: t.base.def,
    baseHp: t.base.hp, baseSpd: t.base.spd,
    skill: quality === 'normal' ? null : pick(Object.keys(PET_SKILLS)),
    alive: true
  };
}
function petStat(){
  if(!Game.pet) return { atk:0,def:0,hp:0,spd:0, pAtk:0,pDef:0,pSpd:0 };
  const p = Game.pet;
  const q = QUALITY[p.quality];
  const g = 1 + (p.lv-1)*0.18;
  const atk = Math.floor(p.baseAtk * q.mult * g);
  const def = Math.floor(p.baseDef * q.mult * g);
  const hp  = Math.floor(p.baseHp  * q.mult * g);
  const spd = Math.floor(p.baseSpd * q.mult * (1+(p.lv-1)*0.08));
  return { atk, def, hp, spd, pAtk:Math.floor(atk*0.2), pDef:Math.floor(def*0.2), pSpd:Math.floor(spd*0.2) };
}
function petSkillState(){
  const st = { crit:0, ls:0, group:false, heal:0 };
  if(!Game.pet || !Game.pet.skill) return st;
  const sk = PET_SKILLS[Game.pet.skill];
  if(sk && sk.apply) sk.apply(st);
  return st;
}
function petAddExp(v){
  if(!Game.pet) return;
  const p = Game.pet;
  p.exp += v;
  while(p.exp >= p.lv * 150){
    p.exp -= p.lv * 150;
    p.lv++;
    toast(`${p.name} 升级 Lv.${p.lv}`);
  }
}

const Nav = {
  stack: ['home'],
  go(pageName, opts){
    if(this.stack[this.stack.length-1] === pageName) return;
    this.stack.push(pageName);
    this._show(pageName, opts);
  },
  back(){
    if(this.stack.length <= 1) return this.home();
    this.stack.pop();
    const prev = this.stack[this.stack.length-1];
    this._show(prev);
  },
  home(){
    this.stack = ['home'];
    this._show('home');
  },
  _show(pageName, opts){
    document.querySelectorAll('.page').forEach(el=>el.classList.add('hidden'));
    $('page-'+pageName).classList.remove('hidden');
    // 触发渲染
    switch(pageName){
      case 'home':   Render.home(); break;
      case 'area':   Render.areaPage(); break;
      case 'floor':  Render.floorPage(); break;
      case 'worn':   Render.wornPage(); break;
      case 'bag':    Render.bagPage(opts && opts.page || 1); break;
      case 'refine': Render.refinePage(opts && opts.idx); break;
      case 'shop':   Render.shopPage(opts && opts.page || 1); break;
      case 'quest':  Render.questPage(opts && opts.page || 1); break;
      case 'pet':    Render.petPage(); break;
      case 'battle': Combat.render(); break;
    }
  }
};

const Equip = {
  wear(idx){
    const e = Game.bag[idx]; if(!e) return;
    const old = Game.worn[e.slot];
    Game.worn[e.slot] = e;
    Game.bag.splice(idx, 1);
    if(old) Game.bag.push(old);
    Quest.onWear(e.name);
    Save.auto();
    Nav._show('bag'); Render.top();
  },
  unwear(slot){
    const e = Game.worn[slot]; if(!e) return;
    if(Game.bag.length >= Game.player.bagMax) return toast("背包已满");
    Game.bag.push(e); Game.worn[slot] = null;
    Save.auto();
    Nav._show('worn'); Render.top();
  },
  sell(idx){
    const e = Game.bag[idx]; if(!e) return;
    const price = Math.floor(EQUIP_BASE[e.name].sell * (1 + QUALITY[e.quality].rate*2) * (e.affix?1.3:1));
    Game.player.gold += price;
    Game.bag.splice(idx, 1);
    toast("出售 +" + price + " 金币");
    Quest.onBagChange();
    Save.auto();
    Nav._show('bag'); Render.top();
  },
  decompose(idx){
    const e = Game.bag[idx]; if(!e) return;
    Game.mat += DECOMP_MAT[e.quality];
    Game.bag.splice(idx, 1);
    toast("分解 +" + DECOMP_MAT[e.quality] + " 材料");
    Quest.onBagChange();
    Save.auto();
    Nav._show('bag'); Render.top();
  },
  autoBest(){
    const pool = Game.bag.slice();
    SLOT_ORDER.forEach(s=>{ if(Game.worn[s]) pool.push(Game.worn[s]); });
    SLOT_ORDER.forEach(s=>{
      const cands = pool.filter(e=>e.slot===s);
      if(cands.length === 0){ Game.worn[s] = null; return; }
      cands.sort((a,b)=>{
        const ta = equipStat(a), tb = equipStat(b);
        const sa = ta.atk*1.5 + ta.def*1.2 + ta.spd*2 + ta.hp*0.3;
        const sb = tb.atk*1.5 + tb.def*1.2 + tb.spd*2 + tb.hp*0.3;
        return sb - sa;
      });
      Game.worn[s] = cands[0];
    });
    const used = new Set(SLOT_ORDER.map(s=>Game.worn[s]).filter(Boolean).map(e=>e.uid));
    Game.bag = pool.filter(e=>!used.has(e.uid));
    while(Game.bag.length > Game.player.bagMax) Game.bag.pop();
    Save.auto();
    Nav._show('worn'); Render.top();
    toast("已装备最强");
  },
  refineRisk(e){
    let risk = 0.12 + (e.refineAtk + e.refineDef + e.refineHp) * 0.004;
    return clamp(risk, 0, 0.9);
  },
  refine(idx){
    const e = Game.bag[idx]; if(!e) return;
    if(e.refineTimes >= 3) return toast("已达洗练上限");
    if(Game.mat < 1) return toast("缺少洗练材料");
    const risk = this.refineRisk(e);
    Game.mat -= 1;
    if(Math.random() < risk){
      e.refineAtk = 0; e.refineDef = 0; e.refineHp = 0;
      toast("💥 洗练破损");
    }else{
      e.refineAtk += rnd(1,6);
      e.refineDef += rnd(1,4);
      if(Math.random() < 0.35) e.refineHp += rnd(2,12);
      e.refineTimes++;
      toast("洗练成功");
    }
    Save.auto();
    Nav._show('refine', {idx}); Render.top();
  }
};

 *  任务
 * ============================================================ */
const Quest = {
  refreshPool(force){
    const now = Date.now();
    if(!force && now - Game.quest.refreshTs < QUEST_POOL_CD) return;
    Game.quest.refreshTs = now;
    Game.quest.avail = [];
    for(let i=0;i<5;i++) Game.quest.avail.push(this.gen());
  },
  cdLeft(){ return Math.max(0, Math.ceil((Game.quest.refreshTs + QUEST_POOL_CD - Date.now())/1000)); },
  gen(){
    const types = ['killMonster','collectItem','reachFloor','payGold','wearEquip'];
    const t = types[rnd(0, types.length-1)];
    const ar = AREAS[rnd(0, AREAS.length-1)];
    const fi = rnd(0, 2);
    const mon = pick(ar.floors[fi].pool);
    const eqName = pick(Object.keys(EQUIP_BASE));
    const q = {
      qid: uid(), type: t,
      targetId: mon.id, targetName: mon.name,
      areaId: ar.id, floorIdx: fi,
      equipName: eqName,
      needCount: rnd(2,5),
      progress: 0, finished: false,
      goldReward: rnd(200,600), expReward: rnd(300,900)
    };
    if(t === 'reachFloor' || t === 'wearEquip') q.needCount = 1;
    return q;
  },
  desc(q){
    switch(q.type){
      case 'killMonster': return `击杀 ${q.needCount} 只「${q.targetName}」 (${q.progress}/${q.needCount})`;
      case 'collectItem': return `收集 ${q.needCount} 件「${q.equipName}」 (${q.progress}/${q.needCount})`;
      case 'reachFloor':  return `到达【${AREA_MAP[q.areaId].name}】第 ${q.floorIdx+1} 层 ${q.finished?'✔':''}`;
      case 'payGold':     return `上交 ${q.needCount*100} 金币 ${q.finished?'✔':''}`;
      case 'wearEquip':   return `穿戴「${q.equipName}」 ${q.finished?'✔':''}`;
    }
    return '';
  },
  accept(i){
    if(Game.quest.doing.length >= 3) return toast("最多 3 个任务");
    const q = Game.quest.avail.splice(i, 1)[0];
    Game.quest.doing.push(q);
    if(q.type === 'reachFloor' && Game.ui.areaId === q.areaId && Game.ui.floorIdx === q.floorIdx) q.finished = true;
    if(q.type === 'collectItem') this.recheckCollect(q);
    if(q.type === 'wearEquip'){
      for(const s in Game.worn){ if(Game.worn[s] && Game.worn[s].name === q.equipName){ q.finished = true; break; } }
    }
    Save.auto(); Nav._show('quest');
  },
  abandon(i){
    confirmBox("确定放弃该任务？", ()=>{
      Game.quest.doing.splice(i, 1);
      Save.auto(); Nav._show('quest');
    });
  },
  claim(i){
    const q = Game.quest.doing[i]; if(!q || !q.finished) return;
    Game.player.gold += q.goldReward;
    addExp(q.expReward);
    Game.quest.doing.splice(i, 1);
    toast(`任务完成 +${q.goldReward}金`);
    Save.auto(); Nav._show('quest'); Render.top();
  },
  payGold(i){
    const q = Game.quest.doing[i]; if(!q) return;
    const cost = q.needCount * 100;
    if(Game.player.gold < cost) return toast("金币不足");
    Game.player.gold -= cost;
    q.finished = true;
    Save.auto(); Nav._show('quest'); Render.top();
  },
  onKill(protoId){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'killMonster' && q.targetId === protoId && !q.finished){
        q.progress++;
        if(q.progress >= q.needCount) q.finished = true;
        changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onReachFloor(areaId, fi){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'reachFloor' && q.areaId === areaId && q.floorIdx === fi && !q.finished){
        q.finished = true; changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onWear(eqName){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'wearEquip' && q.equipName === eqName && !q.finished){
        q.finished = true; changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onBagChange(){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'collectItem'){
        const before = q.progress;
        this.recheckCollect(q);
        if(q.progress !== before) changed = true;
      }
    });
    if(changed) Save.auto();
  },
  recheckCollect(q){
    let n = 0;
    Game.bag.forEach(e=>{ if(e.name === q.equipName) n++; });
    for(const s in Game.worn){ if(Game.worn[s] && Game.worn[s].name === q.equipName) n++; }
    q.progress = Math.min(n, q.needCount);
    if(q.progress >= q.needCount) q.finished = true;
  }
};

const Combat = {
  startGroup(gi){
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    const st = areaState(Game.ui.areaId).floors[fi];
    if(!st.spawned) spawnFloor(Game.ui.areaId, fi);
    const group = st.groups[gi];
    if(!group || groupAllDead(group)) return toast("该组已清空");
    Game.battle = {
      kind:'group', gi, monsters: group.members,
      auto:false, pendingSkill:null, roundCount:0,
      buff:{ zhanshen:0 }, cds:{}
    };
    Nav.go('battle');
  },
  startBoss(){
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    const st = areaState(Game.ui.areaId).floors[fi];
    if(st.bossDeath) return toast("BOSS 未复活");
    const def = ar.floors[fi].boss;
    const boss = {
      mid: uid(), protoId: def.id, name: def.name,
      hp: def.hp, maxHp: def.hp,
      atk: def.atk, def: def.def, spd: def.spd,
      exp: def.exp, gMin: def.gMin, gMax: def.gMax,
      behavior: 'normal', elite: false, affixes: [],
      dead: false, deathTs: 0, vamp: 0, pois: 0,
      isBoss: true,
      dropEquip: def.dropEquip || null,
      unlockDragon: def.unlockDragon || false
    };
    Game.battle = {
      kind:'boss', monsters:[boss], boss,
      auto:false, pendingSkill:null, roundCount:0,
      buff:{ zhanshen:0 }, cds:{}
    };
    Nav.go('battle');
  },

  render(){
    const b = Game.battle; if(!b) return;
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    $('bLoc').textContent = b.kind === 'boss'
      ? `${ar.name} 第${fi+1}层 · BOSS`
      : `${ar.name} 第${fi+1}层 · 第${b.gi+1}组`;

    // 玩家左
    const a = calcAttr();
    const mHp = playerMaxHp();
    const mMp = playerMaxMp();
    const hpP = clamp(Game.player.hp/mHp,0,1)*100;
    const mpP = clamp(Game.player.mp/mMp,0,1)*100;
    const rage = Game.player.rage || 0;
    let buffTag = '';
    if(b.buff.zhanshen > 0) buffTag = `<div class="buff-tag">战神 ${b.buff.zhanshen}</div>`;
    $('bLeft').innerHTML = `
      <div class="p-avatar">🧙</div>
      <div class="p-name">Lv.${Game.player.lv}</div>
      <div class="bar"><i style="width:${hpP}%"></i><div class="txt">${Math.floor(Game.player.hp)}/${mHp}</div></div>
      <div class="bar mp"><i style="width:${mpP}%"></i><div class="txt">${Math.floor(Game.player.mp)}/${mMp}</div></div>
      <div class="rage-line">怒 ${rage}/${RAGE_MAX}</div>
      <div class="p-stats">攻${a.atk}<br>防${a.def}<br>速${a.spd}</div>
      ${buffTag}
    `;

    // 怪物右 2x2 网格
    const grid = $('bGrid');
    grid.innerHTML = '';
    b.monsters.forEach((m, i)=>{
      const card = document.createElement('div');
      card.className = 'mon-unit';
      if(m.dead) card.classList.add('dead');
      if(m.elite) card.classList.add('elite');
      if(m.isBoss) card.classList.add('boss');
      card.id = 'mon-' + m.mid;
      const hpP = clamp(m.hp/m.maxHp,0,1)*100;
      const affixStr = (m.affixes && m.affixes.length)
        ? m.affixes.map(k=>ELITE_AFFIXES.find(a=>a.k===k).name).join('·')
        : '';
      const bhv = MON_BEHAVIOR[m.behavior] ? MON_BEHAVIOR[m.behavior].name : '';
      const infoParts = [`攻${m.atk}`];
      if(bhv && bhv !== '普通') infoParts.push(bhv);
      if(affixStr) infoParts.push(affixStr);
      card.innerHTML = `
        <div class="m-top">
          <span class="m-name">${m.isBoss?'👹':m.elite?'★':'🐾'} ${m.name}</span>
          <span class="dim" style="font-size:9px;">速${m.spd}</span>
        </div>
        <div class="bar mon m-bar"><i style="width:${hpP}%"></i><div class="txt">${Math.max(0,Math.floor(m.hp))}/${m.maxHp}</div></div>
        <div class="m-info">${infoParts.join(' ')}</div>
      `;
      if(!m.dead) card.onclick = ()=>this.clickMonster(i);
      grid.appendChild(card);
    });

    this._refreshSkillBtn('bSkill1', 'liehuo');
    this._refreshSkillBtn('bSkill2', 'banyue');
    this._refreshSkillBtn('bSkill3', 'zhiyu');
    this._refreshSkillBtn('bSkill4', 'zhanshen');
    $('bRageBtn').disabled = (Game.player.rage || 0) < RAGE_MAX;
    $('bAutoBtn').textContent = b.auto ? '停止' : '自动';

    if(b.pendingSkill) $('bTip').textContent = `点击目标释放 ${SKILLS[b.pendingSkill].name}`;
    else if(b.auto) $('bTip').textContent = '自动战斗中…';
    else $('bTip').textContent = '点击怪物发起攻击';
  },

  _refreshSkillBtn(id, key){
    const sk = SKILLS[key];
    const btn = $(id);
    if(!btn) return;
    const b = Game.battle;
    const cd = b.cds ? (b.cds[key] || 0) : 0;
    const shortName = sk.name.slice(0,2);
    if(Game.player.lv < sk.unlock){
      btn.textContent = `${shortName}(${sk.unlock})`;
      btn.disabled = true;
    }else if(cd > 0){
      btn.textContent = `${shortName}(${cd})`;
      btn.disabled = true;
    }else if(Game.player.mp < sk.mp){
      btn.textContent = `${shortName}(${sk.mp}蓝)`;
      btn.disabled = true;
    }else{
      btn.textContent = shortName;
      btn.disabled = false;
    }
  },

  _floatMon(m, text, cls){
    const el = document.getElementById('mon-'+m.mid);
    floatText(el, text, FC[cls] || FC.normal);
  },
  _floatPlayer(text, cls){
    floatText($('bLeft'), text, FC[cls] || FC.normal);
  },

  attack(){
    const b = Game.battle; if(!b || b.pendingSkill) return;
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;
    alive.sort((a,b)=>a.hp - b.hp);
    this._resolveRound({ type:'attack', target: alive[0] });
  },
  clickMonster(i){
    const b = Game.battle; if(!b) return;
    const m = b.monsters[i];
    if(!m || m.dead) return;
    if(b.pendingSkill){
      const skKey = b.pendingSkill;
      b.pendingSkill = null;
      this._resolveRound({ type:'skill', skill: skKey, target: m });
    }else{
      this._resolveRound({ type:'attack', target: m });
    }
  },
  useSkill(key){
    const b = Game.battle; if(!b) return;
    const sk = SKILLS[key]; if(!sk) return;
    if(Game.player.lv < sk.unlock) return toast(`需 Lv.${sk.unlock}`);
    if(b.cds && b.cds[key] > 0) return toast("冷却中");
    if(Game.player.mp < sk.mp) return toast("蓝量不足");
    if(key === 'liehuo'){
      b.pendingSkill = key;
      this.render();
      return;
    }
    this._resolveRound({ type:'skill', skill: key, target: null });
  },
  useRage(){
    const b = Game.battle; if(!b) return;
    if((Game.player.rage||0) < RAGE_MAX) return toast("怒气不足");
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;
    alive.sort((a,b)=>a.hp-b.hp);
    this._resolveRound({ type:'rage', target: alive[0] });
  },
  potion(){
    const b = Game.battle; if(!b) return;
    if(Game.player.potion <= 0) return toast("没有红药");
    Game.player.potion--;
    const heal = Math.floor(playerMaxHp() * 0.35);
    Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
    this._floatPlayer(`+${heal}`, 'heal');
    this._monsterPhaseOnly();
  },
  potionMp(){
    const b = Game.battle; if(!b) return;
    if(Game.player.potionMp <= 0) return toast("没有蓝药");
    Game.player.potionMp--;
    const heal = Math.floor(playerMaxMp() * 0.30);
    Game.player.mp = Math.min(playerMaxMp(), Game.player.mp + heal);
    this._floatPlayer(`+${heal}MP`, 'heal');
    this._monsterPhaseOnly();
  },
  flee(){
    const b = Game.battle; if(!b) return;
    if(Math.random() < 0.45){
      toast('逃跑成功');
      this.stopAuto();
      setTimeout(()=>this.end(), 300);
    }else{
      toast('逃跑失败');
      this._monsterPhaseOnly();
    }
  },
  toggleAuto(){
    const b = Game.battle; if(!b) return;
    b.auto = !b.auto;
    this.render();
    if(b.auto) this._autoTick();
  },
  _autoTick(){
    const b = Game.battle; if(!b || !b.auto) return;
    clearTimeout(b._timer);
    b._timer = setTimeout(()=>{
      if(!Game.battle || !Game.battle.auto) return;
      const alive = Game.battle.monsters.filter(m=>!m.dead);
      if(alive.length === 0) return;
      const mHp = playerMaxHp(), mMp = playerMaxMp();
      if(Game.player.potion > 0 && Game.player.hp/mHp < AUTO_POTION_THRESHOLD){
        this.potion();
      }else if(Game.player.potionMp > 0 && Game.player.mp/mMp < 0.2){
        this.potionMp();
      }else if((Game.player.rage||0) >= RAGE_MAX){
        this.useRage();
      }else if(Game.player.lv >= 3 && (!b.cds.banyue) && alive.length >= 2 && Game.player.mp >= SKILLS.banyue.mp){
        this.useSkill('banyue');
      }else if(Game.player.lv >= 5 && (!b.cds.zhiyu) && Game.player.hp/mHp < 0.5 && Game.player.mp >= SKILLS.zhiyu.mp){
        this.useSkill('zhiyu');
      }else if(Game.player.lv >= 8 && (!b.cds.zhanshen) && b.buff.zhanshen === 0 && Game.player.mp >= SKILLS.zhanshen.mp){
        this.useSkill('zhanshen');
      }else if(Game.player.lv >= 1 && (!b.cds.liehuo) && Game.player.mp >= SKILLS.liehuo.mp){
        const t = Game.battle.monsters.filter(m=>!m.dead).sort((a,b)=>a.hp-b.hp)[0];
        if(t) this._resolveRound({type:'skill', skill:'liehuo', target:t});
        else this.attack();
      }else{
        this.attack();
      }
      if(Game.battle && Game.battle.auto) this._autoTick();
    }, 460);
  },
  stopAuto(){
    const b = Game.battle;
    if(b){ b.auto = false; clearTimeout(b._timer); }
  },

  _resolveRound(action){
    const b = Game.battle; if(!b) return;
    if(!b.cds) b.cds = {};
    b.roundCount++;

    const units = [];
    const pa = calcAttr();
    let atkMul = 1, defMul = 1;
    if(b.buff.zhanshen > 0){ atkMul = 1.3; defMul = 1.3; }

    units.push({ side:'me', spd: pa.spd });
    if(Game.pet && Game.pet.alive !== false){
      const pst = petStat();
      units.push({ side:'pet', spd: pst.spd });
    }
    b.monsters.forEach(m=>{
      if(!m.dead) units.push({ side:'mon', spd: m.spd, m });
    });
    units.sort((a,b)=>b.spd - a.spd);

    for(const u of units){
      if(!Game.battle) return;
      if(u.side === 'me') this._doPlayerAction(action, atkMul);
      else if(u.side === 'pet') this._doPetAction();
      else { if(u.m.dead) continue; this._doMonsterAction(u.m, defMul); }
      if(Game.player.hp <= 0) break;
      if(b.monsters.every(x=>x.dead)) break;
    }

    if(Game.player.hp <= 0){ this._onPlayerDead(); return; }
    if(b.monsters.every(x=>x.dead)){ this._onGroupCleared(); return; }

    // 蓝量回复
    Game.player.mp = Math.min(playerMaxMp(), Game.player.mp + 3 + Math.floor(playerMaxMp()*0.03));
    if(b.buff.zhanshen > 0) b.buff.zhanshen--;
    for(const k in b.cds){ if(b.cds[k] > 0) b.cds[k]--; }

    this.render(); Render.top(); Save.auto();
  },

  _monsterPhaseOnly(){
    const b = Game.battle; if(!b) return;
    const defMul = b.buff.zhanshen > 0 ? 1.3 : 1.0;
    const order = b.monsters.filter(m=>!m.dead).sort((a,b)=>b.spd - a.spd);
    for(const m of order){
      if(!Game.battle) return;
      if(m.dead) continue;
      this._doMonsterAction(m, defMul);
      if(Game.player.hp <= 0) break;
    }
    if(Game.player.hp <= 0){ this._onPlayerDead(); return; }
    for(const k in b.cds){ if(b.cds[k] > 0) b.cds[k]--; }
    if(b.buff.zhanshen > 0) b.buff.zhanshen--;
    Game.player.mp = Math.min(playerMaxMp(), Game.player.mp + 3 + Math.floor(playerMaxMp()*0.03));
    this.render(); Render.top(); Save.auto();
  },

  _doPlayerAction(action, atkMul){
    const b = Game.battle; if(!b) return;
    const a = calcAttr();

    if(action.type === 'attack'){
      const t = action.target;
      if(!t || t.dead) return;
      this._dealDamage(t, a.atk * atkMul, 'normal', true);
      Game.player.rage = Math.min(RAGE_MAX, (Game.player.rage||0) + 1);
    }
    else if(action.type === 'skill'){
      const key = action.skill;
      const sk = SKILLS[key];
      if(!sk || Game.player.lv < sk.unlock) return;
      if(b.cds[key] > 0) return;
      if(Game.player.mp < sk.mp) return;
      b.cds[key] = sk.cd;
      Game.player.mp -= sk.mp;

      if(key === 'liehuo'){
        const t = action.target;
        if(!t || t.dead) return;
        this._dealDamage(t, a.atk * atkMul * 1.8, 'normal', true);
      }
      else if(key === 'banyue'){
        b.monsters.filter(m=>!m.dead).forEach(t=>{
          this._dealDamage(t, a.atk * atkMul * 0.9, 'normal', true);
        });
      }
      else if(key === 'zhiyu'){
        const heal = Math.floor(playerMaxHp() * 0.25);
        Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
        this._floatPlayer(`+${heal}`, 'heal');
      }
      else if(key === 'zhanshen'){
        b.buff.zhanshen = 3;
        this._floatPlayer('祝福', 'heal');
      }
      Game.player.rage = Math.min(RAGE_MAX, (Game.player.rage||0) + 1);
    }
    else if(action.type === 'rage'){
      const t = action.target;
      if(!t || t.dead) return;
      Game.player.rage = 0;
      this._dealDamage(t, a.atk * atkMul * 3.0, 'crit', true);
    }
  },

  _dealDamage(target, baseAtk, forceType, fromMe){
    const a = calcAttr();
    let dmg = Math.max(1, Math.floor(baseAtk - target.def));
    let isCrit = false;
    if(forceType === 'crit') isCrit = true;
    else if(Math.random() < a.crit){ dmg = Math.floor(dmg * a.critD); isCrit = true; }
    target.hp -= dmg;
    this._floatMon(target, `-${dmg}`, isCrit ? 'crit' : 'normal');

    if(fromMe && a.ls > 0){
      const heal = Math.floor(dmg * a.ls);
      if(heal > 0){
        Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
        this._floatPlayer(`+${heal}`, 'heal');
      }
    }
    if(target.hp <= 0 && !target.dead) this._killMonster(target);
  },

  _doPetAction(){
    const b = Game.battle; if(!b) return;
    if(!Game.pet || Game.pet.alive === false) return;
    const pst = petStat();
    const ps = petSkillState();
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;

    if(ps.heal){
      const heal = Math.floor(playerMaxHp() * ps.heal);
      Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
      this._floatPlayer(`+${heal}`, 'heal');
    }
    if(ps.group){
      alive.forEach(t=>{
        let dmg = Math.max(1, Math.floor(pst.atk * 0.3 - t.def * 0.5));
        let isCrit = Math.random() < (0.12 + ps.crit);
        if(isCrit) dmg = Math.floor(dmg * 1.3);
        t.hp -= dmg;
        this._floatMon(t, `-${dmg}`, isCrit ? 'crit' : 'normal');
        if(ps.ls > 0){ Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + Math.floor(dmg * ps.ls)); }
        if(t.hp <= 0 && !t.dead) this._killMonster(t);
      });
    }else{
      const t = alive.sort((a,b)=>a.hp-b.hp)[0];
      let dmg = Math.max(1, Math.floor(pst.atk - t.def));
      let isCrit = Math.random() < (0.12 + ps.crit);
      if(isCrit) dmg = Math.floor(dmg * 1.3);
      t.hp -= dmg;
      this._floatMon(t, `-${dmg}`, isCrit ? 'crit' : 'normal');
      if(ps.ls > 0){ Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + Math.floor(dmg * ps.ls)); }
      if(t.hp <= 0 && !t.dead) this._killMonster(t);
    }
  },

  _doMonsterAction(m, defMul){
    const b = Game.battle; if(!b) return;
    if(m.dead) return;

    if(m.behavior === 'healer'){
      const allies = b.monsters.filter(x=>!x.dead && x !== m);
      if(allies.length > 0){
        const worst = allies.sort((a,b)=>a.hp/a.maxHp - b.hp/b.maxHp)[0];
        const heal = Math.floor(worst.maxHp * 0.15);
        worst.hp = Math.min(worst.maxHp, worst.hp + heal);
        this._floatMon(worst, `+${heal}`, 'heal');
        return;
      }
    }
    if(m.behavior === 'summon' && b.roundCount % 2 === 0){
      const aliveCount = b.monsters.filter(x=>!x.dead).length;
      if(aliveCount < 5){
        const nm = {
          mid: uid(), protoId: m.protoId+'_sum', name:'召唤小怪',
          hp: Math.floor(m.maxHp*0.3), maxHp: Math.floor(m.maxHp*0.3),
          atk: Math.floor(m.atk*0.5), def: Math.floor(m.def*0.5),
          spd: m.spd+2, exp: Math.floor(m.exp*0.2),
          gMin:1, gMax:5, behavior:'normal',
          elite:false, affixes:[], dead:false, deathTs:0, vamp:0, pois:0
        };
        b.monsters.push(nm);
        this.render();
      }
    }

    let atkVal = m.atk;
    if(m.behavior === 'rage' && m.hp/m.maxHp < 0.5) atkVal = Math.floor(atkVal * 1.5);
    const a = calcAttr();
    const defMulFinal = defMul > 1 ? 1.3 : 1;
    let dmg = Math.max(1, Math.floor(atkVal - a.def * defMulFinal * 0.9));
    let isCrit = Math.random() < 0.08;
    if(isCrit) dmg = Math.floor(dmg * 1.25);
    Game.player.hp -= dmg;
    this._floatPlayer(`-${dmg}`, isCrit ? 'crit' : 'normal');
    if(m.vamp) m.hp = Math.min(m.maxHp, m.hp + Math.floor(dmg * m.vamp));
    if(m.pois){
      Game.player.hp -= m.pois;
      this._floatPlayer(`-${m.pois}`, 'poison');
    }
  },

  _killMonster(m){
    if(m.dead) return;
    m.dead = true;
    m.hp = 0;
    m.deathTs = Date.now();
    Game.stats.kills++;
    Game.player.mp = Math.min(playerMaxMp(), Game.player.mp + 5);

    const gold = rnd(m.gMin, m.gMax);
    Game.player.gold += gold;
    addExp(m.exp);
    if(Game.pet) petAddExp(Math.floor(m.exp * 0.5));
    Quest.onKill(m.protoId);

    let dropChance = m.isBoss ? 0.85 : (m.elite ? 0.55 : 0.18);
    if(Math.random() < dropChance){
      const pool = ["木剑","铁剑","布帽","布衣","青铜戒指","木项链"];
      if(m.isBoss && m.dropEquip) pool.push(...m.dropEquip);
      const name = pick(pool);
      const boost = m.isBoss ? 0.15 : (m.elite ? 0.08 : 0);
      const eq = makeEquip(name, rollQuality(boost));
      if(Game.bag.length < Game.player.bagMax){
        Game.bag.push(eq);
        showBattleDrop(`✨ 爆出 ${eq.name}[${QUALITY[eq.quality].name}] +${gold}金`);
        Quest.onBagChange();
      }else{
        showBattleDrop(`+${gold}金 · 背包已满`);
      }
    }else{
      showBattleDrop(`+${gold} 金币`);
    }
    if(m.elite && Math.random() < 0.08 && !Game.pet){
      const tpl = pick(Object.keys(PET_TEMPLATES));
      const q = pick(['good','fine','epic']);
      Game.pet = makePet(tpl, q);
      showBattleDrop(`🥚 精英掉落宠物蛋！孵化出 ${Game.pet.name}`);
    }
    if(m.isBoss){
      if(Math.random() < 0.25 && !Game.pet){
        const tpl = pick(Object.keys(PET_TEMPLATES));
        const q = pick(['fine','epic']);
        Game.pet = makePet(tpl, q);
        showBattleDrop(`🥚 BOSS 掉落宠物蛋！孵化出 ${Game.pet.name}`);
      }
      if(m.unlockDragon){
        Game.flags.dragonCity = true;
        showBattleDrop('🌐 魔龙城已解锁！');
      }
      areaState(Game.ui.areaId).floors[Game.ui.floorIdx].bossDeath = Date.now();
    }
    Save.auto();
  },

  _onGroupCleared(){
    const b = Game.battle; if(!b) return;
    this.stopAuto();
    const st = areaState(Game.ui.areaId).floors[Game.ui.floorIdx];
    if(!st.mark && st.groups.every(g=>g.members.every(m=>m.dead))) st.mark = true;
    Save.auto();
    setTimeout(()=>this.end(), 700);
  },
  _onPlayerDead(){
    toast('💀 死亡！损失 10% 金币');
    Game.player.gold = Math.floor(Game.player.gold * 0.9);
    Game.player.hp = playerMaxHp();
    Game.player.mp = playerMaxMp();
    Game.stats.deaths++;
    this.stopAuto();
    Save.auto();
    setTimeout(()=>this.end(), 900);
  },
  quit(){
    if(Game.battle && Game.battle.monsters.some(m=>!m.dead)){
      confirmBox("战斗未结束，确定退出？", ()=>{
        this.stopAuto();
        this.end();
      });
    }else{
      this.stopAuto();
      this.end();
    }
  },
  end(){
    this.stopAuto();
    Game.battle = null;
    Nav.home();
    Render.top();
  }
};

/* ============================================================
 *  事件绑定
 * ============================================================ */

/* 区域页面选择区域 */
const _origAreaPage = Render.areaPage.bind(Render);
Render.areaPage = function(){
  let html = '';
  AREAS.forEach(ar=>{
    const locked = !ar.unlock && !(ar.id==='dragonCity' && Game.flags.dragonCity);
    if(locked) return;
    html += `<button class="btn primary" style="padding:14px;" onclick="Render._pickArea('${ar.id}')">${ar.name}</button>`;
  });
  $('areaBody').innerHTML = html;
};
Render._pickArea = function(id){
  Game.ui.areaId = id;
  Game.ui.floorIdx = 0;
  const st = areaState(id);
  if(!st.floors[0].spawned) spawnFloor(id, 0);
  Nav.go('floor');
};

/* 定时器：主页倒计时 + 任务刷新 */
setInterval(()=>{
  if(!$('page-home').classList.contains('hidden')) Render._homeTick();
}, 1000);

/* 启动 */
initGame();
Render.top();
Render.home();
</script>
