// ==========全局状态==========
let player = null;
let bag = [];
let equipWorn = {weapon:null,helmet:null,cloth:null,shoe:null,belt:null,ring:null,neck:null};
let matCount = 0;
let areaState = {};
let currentAreaId = null;
let currentFloorIdx = null;
let battleTarget = null;
let autoBattle = false;
let skillCd = 0;

let questAvailable = [];

// 初始化玩家
function initPlayer(){
  player = {
    lv:1,exp:0,hp:100,maxHp:100,baseAtk:10,baseDef:5,gold:100,potion:5,bagMax:20
  };
  bag = [];
  equipWorn = {weapon:null,helmet:null,cloth:null,shoe:null,belt:null,ring:null,neck:null};
  matCount = 0;
  areaState = {};
  currentAreaId=null;currentFloorIdx=null;
  battleTarget=null;autoBattle=false;skillCd=0;
  questDoing = []; questAvailable = []; questRefreshTs = Date.now();
}

// 创建装备实例
function createEquipInstance(baseName,forceQuality=null){
  const base = EQUIP_BASE[baseName];
  let qk = "normal";
  if(!forceQuality){
    const r = Math.random();
    if(r<0.08) qk="epic";
    else if(r<0.22) qk="fine";
    else if(r<0.45) qk="good";
  }else qk=forceQuality;
  const qcfg = QUALITY_CFG[qk];
  const qRate = qcfg.rate;
  return {
    uid:Math.random().toString(36).slice(2),
    name:baseName,
    slot:base.slot,
    baseAtk:base.atk,
    baseDef:base.def,
    qualityKey:qk,
    refineTimes:0,
    refineAtk:0,
    refineDef:0,
    refineHp:0,
    sell:base.sell
  }
}

// 获取装备总属性
function getEquipTotal(eq){
  const qr = QUALITY_CFG[eq.qualityKey].rate;
  let atk = Math.floor((eq.baseAtk+eq.refineAtk)*(1+qr));
  let def = Math.floor((eq.baseDef+eq.refineDef)*(1+qr));
  let hp = eq.refineHp;
  return {atk,def,hp};
}

//计算玩家总属性
function calcPlayerAttr(){
  let a = player.baseAtk;
  let d = player.baseDef;
  let addHp = 0;
  for(let k in equipWorn){
    const e = equipWorn[k];
    if(!e) continue;
    const t = getEquipTotal(e);
    a += t.atk; d+=t.def; addHp += t.hp;
  }
  return {atk:a,def:d,addHp};
}

function refreshPlayerUi(){
  document.getElementById("plyLv").innerText = player.lv;
  document.getElementById("plyExp").innerText = player.exp;
  const attr = calcPlayerAttr();
  document.getElementById("plyHp").innerText = Math.floor(player.hp);
  document.getElementById("plyMaxHp").innerText = player.maxHp + attr.addHp;
  document.getElementById("plyAtk").innerText = attr.atk;
  document.getElementById("plyDef").innerText = attr.def;
  document.getElementById("plyGold").innerText = player.gold;
  document.getElementById("matCount").innerText = matCount;
}

//等级提升
function playerAddExp(val){
  player.exp += val;
  const need = player.lv*120;
  if(player.exp >= need){
    player.exp -= need;
    player.lv +=1;
    player.baseAtk +=4;
    player.baseDef +=2;
    player.maxHp +=25;
    player.hp = player.maxHp;
  }
  refreshPlayerUi();
}

// =========地图状态处理=========
function getAreaState(areaId){
  if(!areaState[areaId]){
    areaState[areaId] = {
      floors:[],
      dragonCityUnlocked:false
    };
    const areaDef = AREAS_CFG.find(x=>x.id===areaId);
    for(let i=0;i<areaDef.floors.length;i++){
      areaState[areaId].floors.push({
        markDone:false,
        monsterDeathTs:{},
        bossDeathTs:null
      })
    }
  }
  return areaState[areaId];
}

//执行楼层复活判定
function checkFloorResurrect(areaId,floorIdx){
  const ast = getAreaState(areaId);
  const fst = ast.floors[floorIdx];
  const areaDef = AREAS_CFG.find(x=>x.id===areaId);
  const floorDef = areaDef.floors[floorIdx];
  const now = Date.now();
  for(let m of floorDef.monsters){
    const ts = fst.monsterDeathTs[m.id];
    if(ts && (now - ts)>=30*1000){
      delete fst.monsterDeathTs[m.id];
    }
  }
  if(fst.bossDeathTs){
    if((now - fst.bossDeathTs)>=120*1000){
      fst.bossDeathTs = null;
    }
  }
}

//弹窗开关
function closeAllPopup(){
  document.querySelectorAll(".popup").forEach(el=>el.classList.add("hidden"));
}
function openAreaSelect(){
  closeAllPopup();
  document.getElementById("popupArea").classList.remove("hidden");
  const box = document.getElementById("areaList");
  box.innerHTML = "";
  AREAS_CFG.forEach(ar=>{
    if(!ar.unlock && !(ar.id==="dragonCity" && getAreaState("dragonCity").dragonCityUnlocked)) return;
    const btn = document.createElement("button");
    btn.className="btn";
    btn.innerText = ar.name;
    btn.onclick=()=>{
      currentAreaId = ar.id;
      openFloorSelect();
    }
    box.appendChild(btn);
  })
}

function openFloorSelect(){
  closeAllPopup();
  document.getElementById("popupFloor").classList.remove("hidden");
  const areaDef = AREAS_CFG.find(x=>x.id===currentAreaId);
  const ast = getAreaState(currentAreaId);
  document.getElementById("floorTitle").innerText = areaDef.name;
  const mbox = document.getElementById("monsterList");
  mbox.innerHTML = "";
  for(let fi=0;fi<areaDef.floors.length;fi++){
    checkFloorResurrect(currentAreaId,fi);
    const fst = ast.floors[fi];
    const floorDef = areaDef.floors[fi];
    const div = document.createElement("div");
    div.className="box";
    div.innerHTML = `<div>第${fi+1}层 ${fst.markDone?"✅印记已解锁":"🔒印记未解锁"}</div>`;
    const enterBtn = document.createElement("button");
    enterBtn.className="btn btn-blue";
    enterBtn.innerText="进入本层";
    enterBtn.onclick=()=>{
      currentFloorIdx = fi;
      renderCurrentFloorMonster();
    }
    div.appendChild(enterBtn);
    mbox.appendChild(div);
  }
}

function renderCurrentFloorMonster(){
  closeAllPopup();
  document.getElementById("popupFloor").classList.remove("hidden");
  const areaDef = AREAS_CFG.find(x=>x.id===currentAreaId);
  const floorDef = areaDef.floors[currentFloorIdx];
  const ast = getAreaState(currentAreaId);
  const fst = ast.floors[currentFloorIdx];
  checkFloorResurrect(currentAreaId,currentFloorIdx);
  document.getElementById("floorTitle").innerText = areaDef.name + " 第"+(currentFloorIdx+1)+"层";
  document.getElementById("markTip").innerText = fst.markDone?"✅印记解锁":"🔒印记未解锁";
  const mbox = document.getElementById("monsterList");
  mbox.innerHTML="";
  floorDef.monsters.forEach(m=>{
    const div = document.createElement("div");
    div.className="box";
    const dead = !!fst.monsterDeathTs[m.id];
    div.innerHTML = `<div>${m.name} ${dead?"【已死亡等待复活】":"存活"} HP:${m.hp}</div>`;
    if(!dead){
      const fightBtn = document.createElement("button");
      fightBtn.className="btn btn-danger";
      fightBtn.innerText="挑战";
      fightBtn.onclick=()=>startBattle({...m});
      div.appendChild(fightBtn);
    }
    mbox.appendChild(div);
  })
  const boss = floorDef.boss;
  const bossDead = !!fst.bossDeathTs;
  const bossDiv = document.createElement("div");
  bossDiv.className="box";
  bossDiv.innerHTML = `<div>👹BOSS ${boss.name} ${bossDead?"【BOSS死亡等待复活】":"存活"} HP:${boss.hp}</div>`;
  if(!bossDead){
    const fb = document.createElement("button");
    fb.className="btn btn-danger";
    fb.innerText="挑战BOSS";
    fb.onclick=()=>startBattle({...boss,isBoss:true});
    bossDiv.appendChild(fb);
  }
  mbox.appendChild(bossDiv);
}

// =========战斗系统=========
function startBattle(mon){
  closeAllPopup();
  document.getElementById("popupBattle").classList.remove("hidden");
  battleTarget = mon;
  autoBattle = false;
  skillCd = 0;
  refreshBattleUi();
  document.getElementById("battleLog").innerText = "";
  battleAppendLog(`遭遇 ${mon.name}！`);
}
function refreshBattleUi(){
  if(!battleTarget) return;
  document.getElementById("battleMonName").innerText = battleTarget.name;
  document.getElementById("battleMonHp").innerText = Math.floor(battleTarget.hp);
  document.getElementById("battleMonMaxHp").innerText = battleTarget.isBoss?AREAS_CFG.find(a=>a.id===currentAreaId).floors[currentFloorIdx].boss.hp:battleTarget.hp;
  const ap = calcPlayerAttr();
  const maxHpAll = player.maxHp + ap.addHp;
  document.getElementById("battlePlayerHp").innerText = Math.floor(player.hp);
  document.getElementById("battlePlayerMaxHp").innerText = maxHpAll;
  document.getElementById("btnAuto").innerText = autoBattle?"停止自动":"自动战斗";
  document.getElementById("battleTip").innerText = skillCd>0?`烈火剑法冷却:${skillCd}回合`:"";
}
function battleAppendLog(s){
  const logDom = document.getElementById("battleLog");
  logDom.innerHTML += s+"\n";
  logDom.scrollTop = logDom.scrollHeight;
}

function monsterTurn(){
  if(!battleTarget || battleTarget.hp<=0) return;
  const ap = calcPlayerAttr();
  let dmg = Math.max(1,battleTarget.atk - ap.def);
  if(Math.random()<0.08){
    dmg = Math.floor(dmg*1.25);
    battleAppendLog(`💥怪物暴击！`);
  }
  player.hp -= dmg;
  battleAppendLog(`${battleTarget.name}对你造成 ${dmg} 伤害`);
  refreshBattleUi();
  if(player.hp <=0){
    battleAppendLog("你死亡！损失10%金币");
    player.gold = Math.floor(player.gold*0.9);
    const ap2 = calcPlayerAttr();
    player.hp = player.maxHp + ap2.addHp;
    autoBattle = false;
    setTimeout(()=>{exitBattle();renderCurrentFloorMonster();refreshPlayerUi();},1200);
    return;
  }
  if(autoBattle){
    setTimeout(()=>{battleAttack()},700);
  }
}

function battleAttack(){
  if(!battleTarget) return;
  const ap = calcPlayerAttr();
  let dmg = Math.max(1,ap.atk - battleTarget.def);
  if(Math.random()<0.12){
    dmg = Math.floor(dmg*1.3);
    battleAppendLog("✨你的攻击暴击！");
  }
  battleTarget.hp -= dmg;
  battleAppendLog(`你攻击造成 ${dmg} 伤害`);
  if(skillCd>0) skillCd--;
  refreshBattleUi();
  checkBattleMonsterDead();
}

function battleSkill(){
  if(skillCd>0){battleAppendLog("技能冷却中");return;}
  const ap = calcPlayerAttr();
  let dmg = Math.floor(Math.max(1,ap.atk - battleTarget.def)*1.8);
  battleTarget.hp -= dmg;
  battleAppendLog(`🔥烈火剑法！造成 ${dmg} 伤害`);
  skillCd = 3;
  refreshBattleUi();
  checkBattleMonsterDead();
}

function battleUsePotion(){
  if(player.potion<=0){battleAppendLog("没有红药");return;}
  player.potion--;
  const ap = calcPlayerAttr();
  const heal = Math.floor((player.maxHp+ap.addHp)*0.35);
  player.hp = Math.min(player.maxHp+ap.addHp,player.hp+heal);
  battleAppendLog(`喝红药恢复${heal}生命`);
  refreshBattleUi();
  if(autoBattle) setTimeout(()=>battleAttack(),600);
}

function battleFlee(){
  if(Math.random()<0.45){
    battleAppendLog("逃跑成功！");
    autoBattle=false;
    exitBattle();
  }else{
    battleAppendLog("逃跑失败！怪物发起进攻");
    monsterTurn();
  }
}

function toggleAutoBattle(){
  autoBattle = !autoBattle;
  refreshBattleUi();
  if(autoBattle) battleAttack();
}

function checkBattleMonsterDead(){
  if(battleTarget.hp>0){
    setTimeout(()=>monsterTurn(),550);
    return;
  }
  battleAppendLog(`✅击杀 ${battleTarget.name}`);
  const areaDef = AREAS_CFG.find(x=>x.id===currentAreaId);
  const ast = getAreaState(currentAreaId);
  const fst = ast.floors[currentFloorIdx];
  const nowTs = Date.now();
  if(battleTarget.isBoss){
    fst.bossDeathTs = nowTs;
    if(battleTarget.unlockDragonCity){
      ast.dragonCityUnlocked = true;
    }
  }else{
    fst.monsterDeathTs[battleTarget.id] = nowTs;
    if(!fst.markDone){
      fst.markDone = true;
      battleAppendLog("🔓本层印记已点亮，可以前往下一层");
    }
  }
  //掉落金币
  const goldDrop = battleTarget.gMin + Math.floor(Math.random()*(battleTarget.gMax-battleTarget.gMin));
  player.gold += goldDrop;
  battleAppendLog(`获得金币 ${goldDrop}`);
  //掉落装备
  if(Math.random()<0.28){
    const pool = ["木剑","铁剑","布帽","布衣","青铜戒指","木项链"];
    if(battleTarget.dropEquip){
      pool.push(...battleTarget.dropEquip);
    }
    const dropName = pool[Math.floor(Math.random()*pool.length)];
    const newEq = createEquipInstance(dropName,null);
    if(bag.length < player.bagMax){
      bag.push(newEq);
      const qc = QUALITY_CFG[newEq.qualityKey];
      battleAppendLog(`✨爆出【${newEq.name}】<span class="${qc.cls}">${qc.text}</span>`);
    }else{
      battleAppendLog("背包已满，装备丢失");
    }
  }
  playerAddExp(battleTarget.exp);
  questCheckKillProgress(battleTarget.id);
  if(autoBattle){
    autoBattle=false;
    setTimeout(()=>{exitBattle();renderCurrentFloorMonster();},800);
  }else{
    setTimeout(()=>{exitBattle();renderCurrentFloorMonster();},1000);
  }
}

function exitBattle(){
  battleTarget=null;autoBattle=false;skillCd=0;
  closeAllPopup();
}

//====背包穿戴洗练分解====
function openBag(){
  closeAllPopup();
  document.getElementById("popupBag").classList.remove("hidden");
  refreshBagUi();
}
function refreshBagUi(){
  const blist = document.getElementById("bagList");
  blist.innerHTML="";
  document.getElementById("bagSizeTip").innerText = `(${bag.length}/${player.bagMax})`;
  bag.forEach((eq,idx)=>{
    const qc = QUALITY_CFG[eq.qualityKey];
    const div = document.createElement("div");
    div.className="box";
    const t = getEquipTotal(eq);
    div.innerHTML = `<div class="${qc.cls}">${eq.name}[${qc.text}]</div><div>攻:${t.atk} 防:${t.def} HP+${t.hp} 洗练${eq.refineTimes}/3</div>`;
    const btnWrap = document.createElement("div");
    const wearBtn = document.createElement("button");
    wearBtn.className="btn";wearBtn.innerText="穿戴";
    wearBtn.onclick=()=>wearEquip(idx);
    const refineBtn = document.createElement("button");
    refineBtn.className="btn btn-blue";refineBtn.innerText="洗练";
    refineBtn.onclick=()=>openRefine(idx);
    const dropBtn = document.createElement("button");
    dropBtn.className="btn btn-danger";dropBtn.innerText="丢弃";
    dropBtn.onclick=()=>{bag.splice(idx,1);refreshBagUi();}
    btnWrap.appendChild(wearBtn);btnWrap.appendChild(refineBtn);btnWrap.appendChild(dropBtn);
    div.appendChild(btnWrap);
    blist.appendChild(div);
  })
  //分解列表
  const decompBox = document.getElementById("decomposeList");
  decompBox.innerHTML="";
  bag.forEach((eq,idx)=>{
    const qc = QUALITY_CFG[eq.qualityKey];
    const dBtn = document.createElement("button");
    dBtn.className="btn";
    dBtn.innerText=`分解 ${eq.name}[${qc.text}]`;
    dBtn.onclick=()=>{
      const matGain = DECOMPOSE_MAT[eq.qualityKey];
      matCount += matGain;
      bag.splice(idx,1);
      refreshBagUi();
    }
    decompBox.appendChild(dBtn);
  })
}

function wearEquip(bagIdx){
  const eq = bag[bagIdx];
  const old = equipWorn[eq.slot];
  if(old) bag.push(old);
  equipWorn[eq.slot] = eq;
  bag.splice(bagIdx,1);
  refreshBagUi();refreshEquipUi();refreshPlayerUi();
}

function openEquipUi(){
  closeAllPopup();
  document.getElementById("popupEquip").classList.remove("hidden");
  refreshEquipUi();
}
function refreshEquipUi(){
  const slots = ["weapon","helmet","cloth","shoe","belt","ring","neck"];
  const slotDomId = {
    weapon:"slot-weapon",helmet:"slot-helmet",cloth:"slot-cloth",
    shoe:"slot-shoe",belt:"slot-belt",ring:"slot-ring",neck:"slot-neck"
  };
  slots.forEach(s=>{
    const dom = document.getElementById(slotDomId[s]);
    const e = equipWorn[s];
    if(!e){dom.innerText=s;dom.className="equip-slot";return;}
    const qc = QUALITY_CFG[e.qualityKey];
    dom.className="equip-slot "+qc.cls;
    dom.innerText = e.name;
    dom.onclick=()=>{
      bag.push(e);
      equipWorn[s]=null;
      refreshEquipUi();refreshPlayerUi();
    }
  })
}

let currentRefineBagIdx = -1;
function openRefine(idx){
  currentRefineBagIdx = idx;
  closeAllPopup();
  document.getElementById("popupRefine").classList.remove("hidden");
  const eq = bag[idx];
  const qc = QUALITY_CFG[eq.qualityKey];
  const ti = getEquipTotal(eq);
  document.getElementById("refineInfo").innerHTML = `
    <div class="${qc.cls}">${eq.name}[${qc.text}]</div>
    <div>当前攻${ti.atk} 防${ti.def} HP+${ti.hp}</div>
    <div>洗练次数:${eq.refineTimes}/3</div>
    <div>洗练材料:${matCount}</div>
  `;
}
function doRefine(){
  const eq = bag[currentRefineBagIdx];
  if(!eq) return;
  if(eq.refineTimes>=3) return alert("最多洗练3次");
  let risk = 0.12 + (eq.refineAtk+eq.refineDef+eq.refineHp)*0.004;
  const consumeMat = Math.min(matCount,Math.ceil(risk/0.05));
  risk -= consumeMat*0.05;
  risk = Math.max(0,risk);
  matCount -= consumeMat;
  if(Math.random()<risk){
    eq.refineAtk=0;eq.refineDef=0;eq.refineHp=0;
    alert("装备洗练破损，附加属性清零！");
  }else{
    eq.refineAtk += Math.floor(Math.random()*6)+1;
    eq.refineDef += Math.floor(Math.random()*4)+1;
    if(Math.random()<0.35) eq.refineHp += Math.floor(Math.random()*12)+2;
    eq.refineTimes +=1;
  }
  openRefine(currentRefineBagIdx);
  refreshPlayerUi();
}

//商店
function openShop(){
  closeAllPopup();
  document.getElementById("popupShop").classList.remove("hidden");
  const sbox = document.getElementById("shopList");
  sbox.innerHTML="";
  SHOP_EQUIP_LIST.forEach(name=>{
    const base = EQUIP_BASE[name];
    const div = document.createElement("div");
    div.className="box";
    div.innerHTML = `<div>${name} 攻${base.atk} 防${base.def} 购买:${base.buy}金币</div>`;
    const buyBtn = document.createElement("button");
    buyBtn.className="btn btn-green";buyBtn.innerText="购买(普通品质)";
    buyBtn.onclick=()=>{
      if(player.gold < base.buy){alert("金币不足");return;}
      if(bag.length >= player.bagMax){alert("背包已满");return;}
      player.gold -= base.buy;
      const neq = createEquipInstance(name,"normal");
      bag.push(neq);
      refreshPlayerUi();openShop();
    }
    div.appendChild(buyBtn);
    sbox.appendChild(div);
  })
}

// =========任务系统============
function genOneQuest(){
  const types = ["killMonster","collectItem","reachFloor","payGold","wearEquip"];
  const t = types[Math.floor(Math.random()*types.length)];
  const areaDef = AREAS_CFG[Math.floor(Math.random()*AREAS_CFG.length)];
  const floorIdx = Math.floor(Math.random()*3);
  const floorDef = areaDef.floors[floorIdx];
  const mon = floorDef.monsters[Math.floor(Math.random()*floorDef.monsters.length)];
  const equipName = Object.keys(EQUIP_BASE)[Math.floor(Math.random()*Object.keys(EQUIP_BASE).length)];
  let q = {
    qid:Math.random().toString(36).slice(2),
    type:t,
    targetId:mon.id,
    targetName:mon.name,
    areaId:areaDef.id,
    floorIdx:floorIdx,
    equipName:equipName,
    needCount:Math.floor(Math.random()*4)+2,
    progress:0,
    goldReward:Math.floor(Math.random()*400)+200,
    expReward:Math.floor(Math.random()*600)+300,
    finished:false
  };
  return q;
}

function refreshQuestPool(){
  const now = Date.now();
  const cdLeft = Math.ceil((questRefreshTs+120*1000-now)/1000);
  if(cdLeft>0) return;
  questAvailable = [];
  for(let i=0;i<5;i++) questAvailable.push(genOneQuest());
  questRefreshTs = now;
}

function openQuestPanel(){
  closeAllPopup();
  document.getElementById("popupQuest").classList.remove("hidden");
  refreshQuestPool();
  refreshQuestUi();
}

function refreshQuestUi(){
  document.getElementById("doingQuestCnt").innerText = questDoing.length;
  const now = Date.now();
  const cdLeft = Math.max(0,Math.ceil((questRefreshTs+120*1000-now)/1000));
  document.getElementById("questCdTip").innerText = cdLeft;

  const doingBox = document.getElementById("doingQuestBox");
  doingBox.innerHTML="";
  questDoing.forEach((q,idx)=>{
    const div = document.createElement("div");
    div.className="box";
    let desc = "";
    if(q.type==="killMonster") desc=`击杀${q.needCount}只${q.targetName} (${q.progress}/${q.needCount})`;
    else if(q.type==="collectItem") desc=`收集${q.needCount}个${q.equipName}(${q.progress}/${q.needCount})`;
    else if(q.type==="reachFloor") desc=`到达【${AREAS_CFG.find(a=>a.id===q.areaId).name}】第${q.floorIdx+1}层`;
    else if(q.type==="payGold") desc=`上交${q.needCount*100}金币`;
    else if(q.type==="wearEquip") desc=`穿戴装备【${q.equipName}】`;
    div.innerHTML = `<div>${desc}</div><div>奖励:${q.goldReward}金币 ${q.expReward}经验</div>`;
    if(q.finished){
      div.style.opacity="0.45";
      const getBtn = document.createElement("button");
      getBtn.className="btn";getBtn.innerText="领取奖励";
      getBtn.onclick=()=>{
        player.gold += q.goldReward;
        playerAddExp(q.expReward);
        questDoing.splice(idx,1);
        refreshQuestUi();refreshPlayerUi();
      }
      div.appendChild(getBtn);
    }
    const abandonBtn = document.createElement("button");
    abandonBtn.className="btn btn-danger";abandonBtn.innerText="放弃";
    abandonBtn.onclick=()=>{
      questDoing.splice(idx,1);
      refreshQuestUi();
    }
    div.appendChild(abandonBtn);
    doingBox.appendChild(div);
  })

  const availBox = document.getElementById("availQuestBox");
  availBox.innerHTML="";
  questAvailable.forEach((q,idx)=>{
    const div = document.createElement("div");
    div.className="box";
    let desc = "";
    if(q.type==="killMonster") desc=`击杀${q.needCount}只${q.targetName}`;
    else if(q.type==="collectItem") desc=`收集${q.needCount}个${q.equipName}`;
    else if(q.type==="reachFloor") desc=`到达【${AREAS_CFG.find(a=>a.id===q.areaId).name}】第${q.floorIdx+1}层`;
    else if(q.type==="payGold") desc=`上交${q.needCount*100}金币`;
    else if(q.type==="wearEquip") desc=`穿戴装备【${q.equipName}】`;
    div.innerHTML = `<div>${desc}</div><div>奖励:${q.goldReward}金币 ${q.expReward}经验</div>`;
    const takeBtn = document.createElement("button");
    takeBtn.className="btn btn-green";takeBtn.innerText="接取任务";
    takeBtn.onclick=()=>{
      if(questDoing.length>=3){alert("最多同时接3个任务");return;}
      questDoing.push(q);
      questAvailable.splice(idx,1);
      refreshQuestUi();
    }
    div.appendChild(takeBtn);
    availBox.appendChild(div);
  })
}

function questCheckKillProgress(monId){
  questDoing.forEach(q=>{
    if(q.type==="killMonster" && q.targetId===monId && !q.finished){
      q.progress +=1;
      if(q.progress>=q.needCount) q.finished=true;
    }
  })
}

//====存档读档重置====
function gameSave(){
  const saveObj = {
    player:JSON.parse(JSON.stringify(player)),
    bag:JSON.parse(JSON.stringify(bag)),
    equipWorn:JSON.parse(JSON.stringify(equipWorn)),
    matCount:matCount,
    areaState:JSON.parse(JSON.stringify(areaState)),
    questDoing:JSON.parse(JSON.stringify(questDoing)),
    questAvailable:JSON.parse(JSON.stringify(questAvailable)),
    questRefreshTs:questRefreshTs
  };
  localStorage.setItem("legendSave",JSON.stringify(saveObj));
  alert("存档成功");
}
function gameLoad(){
  const s = localStorage.getItem("legendSave");
  if(!s){alert("无存档");return;}
  const d = JSON.parse(s);
  player = d.player;
  bag = d.bag;
  equipWorn = d.equipWorn;
  matCount = d.matCount;
  areaState = d.areaState;
  questDoing = d.questDoing;
  questAvailable = d.questAvailable;
  questRefreshTs = d.questRefreshTs;
  currentAreaId=null;currentFloorIdx=null;
  closeAllPopup();
  refreshPlayerUi();
  alert("读档完成");
}
function gameReset(){
  if(!confirm("确定全部重置？")) return;
  localStorage.removeItem("legendSave");
  initPlayer();
  closeAllPopup();
  refreshPlayerUi();
}

//启动
initPlayer();
refreshPlayerUi();
</script>
