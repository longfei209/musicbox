<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>传奇 · 黑白 · 群战版</title>
<style>
:root{
  --bg:#0a0a0a; --panel:#151515; --panel2:#1e1e1e; --panel3:#262626;
  --line:#333; --line2:#444;
  --tx:#e8e8e8; --tx2:#aaa; --tx3:#777; --tx4:#555;
  --q1:#888; --q2:#aaa; --q3:#ddd; --q4:#fff;
  --hp:#ddd; --hp2:#666; --mana:#aaa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--tx);
  font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  max-width:720px; margin:0 auto; min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font:inherit;}

.btn{display:block;width:100%;padding:10px;margin:4px 0;background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:4px;text-align:center;transition:.12s;}
.btn:active{background:#2e2e2e;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.primary{background:#2a2a2a;border-color:#666;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--tx2);}
.btn.danger{border-color:#5a2a2a;color:#d99;}
.btn.warn{border-color:#7a5a2a;color:#e8a;}
.btn.sm{display:inline-block;width:auto;padding:6px 10px;margin:3px 3px 3px 0;font-size:13px;}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.row .btn{flex:1;min-width:0;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;}
.panel h3{font-size:15px;margin-bottom:8px;color:var(--tx);font-weight:600;}
.panel h4{font-size:13px;margin:8px 0 4px;color:var(--tx2);}
.dim{color:var(--tx3);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:3px;font-size:11px;color:var(--tx2);margin-right:4px;}

.q-normal{color:var(--q1);}
.q-good{color:var(--q2);}
.q-fine{color:var(--q3);}
.q-epic{color:var(--q4);font-weight:700;}
.q-epic::before{content:"★ ";}

.bar{height:14px;background:#0e0e0e;border:1px solid var(--line2);border-radius:3px;overflow:hidden;position:relative;}
.bar>i{display:block;height:100%;background:#e0e0e0;transition:width .18s;}
.bar>.txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff;}
.bar.mon>i{background:#999;}
.bar.exp>i{background:#777;}

.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px;}
.topbar .l1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;flex-wrap:wrap;gap:4px;}
.topbar .l2{display:flex;gap:8px;font-size:12px;color:var(--tx2);margin-top:6px;flex-wrap:wrap;}

#main{padding:10px;padding-bottom:40px;}

.mon-card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px;margin:6px 0;}
.mon-card .name{font-size:14px;}
.mon-card .meta{font-size:12px;color:var(--tx3);margin:2px 0 6px;}
.mon-card.dead{opacity:.4;}
.boss-card{border-color:#555;background:var(--panel2);}
.elite-tag{border-color:#888;color:#ddd;}

#battle{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;}
#battle.hidden{display:none;}
#battle .b-top{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);}
#battle .b-field{flex:1;overflow-y:auto;padding:8px 10px;}
.mon-unit{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px;margin:6px 0;cursor:pointer;transition:.1s;}
.mon-unit:active{background:var(--panel2);}
.mon-unit.targeted{border-color:#888;background:#222;}
.mon-unit.dead{opacity:.3;pointer-events:none;}
.mon-unit .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.mon-unit .avatar{font-size:22px;margin-right:6px;}
.mon-unit .info{font-size:11px;color:var(--tx3);margin-top:4px;}
.mon-unit.elite{border-color:#666;}
.mon-unit.boss{border-color:#888;background:var(--panel2);}

#battle .b-me{padding:8px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);}
#battle .b-me .row1{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:4px;flex-wrap:wrap;gap:4px;}
#battle .b-me .row2{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px;}

#battle .b-log{max-height:140px;overflow-y:auto;padding:6px 10px;background:#0d0d0d;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--tx2);line-height:1.6;border-top:1px solid var(--line);}
#battle .b-log .l-me{color:#e8e8e8;}
#battle .b-log .l-mon{color:#999;}
#battle .b-log .l-sys{color:#777;}
#battle .b-log .l-good{color:#fff;}
#battle .b-log .l-bad{color:#b88;}
#battle .b-log .l-pet{color:#aaa;font-style:italic;}
#battle .b-ctrl{padding:8px 10px 12px;border-top:1px solid var(--line);}
#battle .tip{font-size:12px;color:var(--tx3);min-height:16px;margin-bottom:4px;}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;}
.overlay.hidden{display:none;}
.sheet{width:100%;max-width:720px;max-height:88vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line2);border-radius:12px 12px 0 0;padding:14px 12px 18px;}
.sheet h3{font-size:16px;margin-bottom:8px;}
.sheet .close-row{position:sticky;bottom:0;background:var(--panel);padding-top:8px;}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#eee;border:1px solid #444;padding:8px 14px;border-radius:20px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;}
#toast.on{opacity:1;}

#confirm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;}
#confirm.hidden{display:none;}
#confirm .box{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:16px;max-width:340px;width:100%;}
#confirm .msg{font-size:14px;margin-bottom:14px;}

.pet-mini{font-size:11px;color:var(--tx3);}
</style>
</head>
<body>

<div class="topbar">
  <div class="l1">
    <span>Lv.<b id="tLv">1</b> <span class="dim">|</span> 金币 <b id="tGold">0</b></span>
    <span class="dim">红药 <b id="tPotion">0</b> · 材料 <b id="tMat">0</b> · 怒气 <b id="tRage">0</b>/10</span>
  </div>
  <div class="bar" style="margin-bottom:4px;"><i id="tHpBar"></i><div class="txt" id="tHpTxt">0/0</div></div>
  <div class="bar exp"><i id="tExpBar"></i><div class="txt" id="tExpTxt">0/0</div></div>
  <div class="l2">
    <span>攻 <b id="tAtk">0</b></span>
    <span>防 <b id="tDef">0</b></span>
    <span>速 <b id="tSpd">0</b></span>
    <span id="tPet" class="pet-mini">宠物：无</span>
    <span id="tLoc" class="dim">未选择地图</span>
  </div>
</div>

<div id="main">
  <div class="panel">
    <div class="row">
      <button class="btn sm" onclick="UI.openArea()">选择地图</button>
      <button class="btn sm" onclick="UI.openWorn()">人物</button>
      <button class="btn sm" onclick="UI.openBag()">背包</button>
    </div>
    <div class="row">
      <button class="btn sm" onclick="UI.openShop()">商店</button>
      <button class="btn sm" onclick="UI.openQuest()">任务</button>
      <button class="btn sm" onclick="UI.openPet()">宠物</button>
    </div>
    <div class="row">
      <button class="btn sm" onclick="Save.manual()">存档</button>
      <button class="btn sm" onclick="Save.load()">读档</button>
      <button class="btn sm ghost" onclick="Save.reset()">重置</button>
    </div>
  </div>
  <div id="mainInfo"></div>
</div>

<div id="battle" class="hidden">
  <div class="b-top">
    <span id="bLoc">战斗</span>
    <button class="btn sm ghost" style="margin:0;" onclick="Combat.quit()">退出</button>
  </div>
  <div class="b-field" id="bField"></div>
  <div class="b-me">
    <div class="row1">
      <span>我方 Lv.<b id="bLv">1</b></span>
      <span id="bBuffTip" class="dim"></span>
    </div>
    <div class="bar"><i id="bMeHpBar"></i><div class="txt" id="bMeHpTxt">0/0</div></div>
    <div class="row2">
      <span>攻 <b id="bMeAtk">0</b> 防 <b id="bMeDef">0</b> 速 <b id="bMeSpd">0</b></span>
      <span>红药 <b id="bPotTip">0</b> · 怒气 <b id="bRageTip">0</b>/10</span>
    </div>
  </div>
  <div class="b-log" id="bLog"></div>
  <div class="b-ctrl">
    <div class="tip" id="bTip"></div>
    <div class="row" style="margin-bottom:6px;">
      <button class="btn primary" onclick="Combat.attack()">攻击</button>
      <button class="btn" id="bSkill1" onclick="Combat.useSkill('liehuo')">烈火剑法</button>
      <button class="btn" id="bSkill2" onclick="Combat.useSkill('banyue')">半月弯刀</button>
    </div>
    <div class="row" style="margin-bottom:6px;">
      <button class="btn" id="bSkill3" onclick="Combat.useSkill('zhiyu')">治愈术</button>
      <button class="btn" id="bSkill4" onclick="Combat.useSkill('zhanshen')">战神祝福</button>
      <button class="btn warn" id="bRageBtn" onclick="Combat.useRage()">怒斩</button>
    </div>
    <div class="row">
      <button class="btn" onclick="Combat.potion()">喝红药</button>
      <button class="btn" id="bAutoBtn" onclick="Combat.toggleAuto()">自动</button>
      <button class="btn danger" onclick="Combat.flee()">逃跑</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="confirm" class="hidden"><div class="box"><div class="msg" id="cfmMsg"></div><div class="row"><button class="btn ghost" id="cfmNo">取消</button><button class="btn primary" id="cfmYes">确定</button></div></div></div>

 *  工具

const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1600);
}
function confirmBox(msg, onYes){
  $('cfmMsg').textContent = msg;
  const box = $('confirm'); box.classList.remove('hidden');
  const yes = $('cfmYes'), no = $('cfmNo');
  const close = ()=>{ box.classList.add('hidden'); yes.onclick=null; no.onclick=null; };
  yes.onclick = ()=>{ close(); onYes && onYes(); };
  no.onclick  = ()=>{ close(); };
}

/* ---- 装备实例 ---- */
function rollQuality(boost){
  const r = Math.random();
  const epicC = 0.03 + (boost||0);
  const fineC = 0.15 + (boost||0);
  const goodC = 0.40 + (boost||0)*1.5;
  if(r < epicC) return 'epic';
  if(r < fineC) return 'fine';
  if(r < goodC) return 'good';
  return 'normal';
}
function makeEquip(name, quality){
  const base = EQUIP_BASE[name];
  const eq = {
    uid: uid(), name, slot: base.slot,
    baseAtk: base.atk, baseDef: base.def, baseSpd: base.spd || 0, baseHp: base.hp || 0,
    quality: quality || rollQuality(),
    refineAtk:0, refineDef:0, refineHp:0, refineTimes:0,
    affix:null, affixVal:0
  };
  // 概率附词缀
  if(Math.random() < 0.25){
    const a = pick(AFFIXES);
    const v = a.roll();
    eq.affix = a.k;
    eq.affixVal = v;
    a.apply(eq, v);
  }
  return eq;
}
function equipStat(eq){
  const r = QUALITY[eq.quality].rate;
  let atk = Math.floor((eq.baseAtk + eq.refineAtk) * (1 + r));
  let def = Math.floor((eq.baseDef + eq.refineDef) * (1 + r));
  let spd = Math.floor((eq.baseSpd || 0) * (1 + r * 0.5)) + (eq.affixSpd || 0);
  let hp  = (eq.baseHp || 0) + eq.refineHp + (eq.affixHp || 0);
  return { atk, def, spd, hp };
}
function equipAffixDesc(eq){
  if(!eq.affix) return '';
  const a = AFFIXES.find(x=>x.k===eq.affix);
  return a ? a.desc(eq.affixVal) : '';
}

function calcAttr(){
  let atk = Game.player.baseAtk, def = Game.player.baseDef, spd = Game.player.baseSpd, addHp = 0;
  let crit = 0.12, critD = 1.3, ls = 0;
  for(const s in Game.worn){
    const e = Game.worn[s]; if(!e) continue;
    const t = equipStat(e);
    atk += t.atk; def += t.def; spd += t.spd; addHp += t.hp;
    if(e.affixCrit) crit += e.affixCrit / 100;
    if(e.affixCritD) critD += e.affixCritD / 100;
    if(e.affixLs) ls += e.affixLs / 100;
  }
  // 套装
  for(const sk in SETS){
    const set = SETS[sk];
    let cnt = 0;
    set.members.forEach(nm=>{
      for(const s in Game.worn){
        if(Game.worn[s] && Game.worn[s].name === nm){ cnt++; break; }
      }
    });
    if(cnt >= 3 && set.bonus3){ atk += set.bonus3.atk||0; def += set.bonus3.def||0; }
    if(cnt >= 4 && set.bonus4){ atk += set.bonus4.atk||0; def += set.bonus4.def||0; addHp += set.bonus4.hp||0; spd += set.bonus4.spd||0; }
    if(cnt >= 2 && set.bonus2){ atk += set.bonus2.atk||0; def += set.bonus2.def||0; spd += set.bonus2.spd||0; }
  }
  // 宠物被动
  if(Game.pet && Game.pet.alive !== false){
    const pst = petStat();
    atk += pst.pAtk || 0;
    def += pst.pDef || 0;
    spd += pst.pSpd || 0;
  }
  return { atk, def, spd, addHp, crit, critD, ls };
}
function playerMaxHp(){ return Game.player.maxHp + calcAttr().addHp; }

function addExp(v){
  const p = Game.player;
  p.exp += v;
  let leveled = false;
  while(p.exp >= p.lv * 120){
    p.exp -= p.lv * 120;
    p.lv++;
    p.baseAtk += 4; p.baseDef += 2; p.maxHp += 25; p.baseSpd += 1;
    leveled = true;
  }
  if(leveled){ p.hp = playerMaxHp(); toast("升级！Lv." + p.lv); Save.auto(); }
  Render.top();
}

/* ---- 区域状态 ---- */
function areaState(id){
  if(!Game.areaState[id]){
    const def = AREA_MAP[id];
    Game.areaState[id] = {
      floors: def.floors.map(()=>({
        mark:false,
        groups:[],        // 每次进入/刷新时生成
        bossDeath:0,
        spawned:false
      }))
    };
  }
  return Game.areaState[id];
}

/* 生成某层的怪物组 */
function spawnFloor(areaId, fi){
  const ar = AREA_MAP[areaId];
  const st = areaState(areaId).floors[fi];
  const pool = ar.floors[fi].pool;
  st.groups = [];
  for(let g=0; g<GROUPS_PER_FLOOR; g++){
    const count = rnd(1,4);
    const members = [];
    for(let i=0;i<count;i++){
      const proto = pick(pool);
      const isElite = Math.random() < ELITE_CHANCE;
      const m = {
        mid: uid(),
        protoId: proto.id,
        name: proto.name,
        hp: proto.hp, maxHp: proto.hp,
        atk: proto.atk, def: proto.def, spd: proto.spd,
        exp: proto.exp, gMin: proto.gMin, gMax: proto.gMax,
        behavior: proto.behavior,
        elite: isElite,
        affixes: [],
        dead: false,
        deathTs: 0,
        vamp: 0, pois: 0
      };
      if(isElite){
        m.name = "精英·" + m.name;
        m.hp = Math.floor(m.hp * 1.6); m.maxHp = m.hp;
        m.atk = Math.floor(m.atk * 1.3);
        m.def = Math.floor(m.def * 1.3);
        m.exp = Math.floor(m.exp * 1.8);
        m.gMin = Math.floor(m.gMin * 2);
        m.gMax = Math.floor(m.gMax * 2);
        const n = rnd(1,2);
        const chosen = [...ELITE_AFFIXES].sort(()=>Math.random()-0.5).slice(0, n);
        chosen.forEach(af=>{ af.apply(m); m.affixes.push(af.k); });
      }
      members.push(m);
    }
    st.groups.push({ gid: uid(), members, cleared:false });
  }
  st.spawned = true;
}
function floorCleared(areaId, fi){
  const st = areaState(areaId).floors[fi];
  if(!st.spawned) return false;
  return st.groups.every(g => g.members.every(m => m.dead));
}
function tickRespawn(areaId, fi){
  const st = areaState(areaId).floors[fi];
  const now = Date.now();
  st.groups.forEach(g=>{
    g.members.forEach(m=>{
      if(m.dead && now - m.deathTs >= RESPAWN_MON){
        m.dead = false;
        m.hp = m.maxHp;
        g.cleared = false;
      }
    });
  });
  if(st.bossDeath && now - st.bossDeath >= RESPAWN_BOSS){
    st.bossDeath = 0;
  }
  // 印记：本层所有普通怪都死过一遍即点亮
  if(!st.mark && st.spawned && st.groups.every(g=>g.members.every(m=>m.dead))){
    st.mark = true;
  }
}

function makePet(tplKey, quality){
  const t = PET_TEMPLATES[tplKey];
  const q = QUALITY[quality];
  const pet = {
    tpl: tplKey,
    name: t.name,
    avatar: t.avatar,
    quality: quality,
    lv: 1,
    exp: 0,
    baseAtk: t.base.atk,
    baseDef: t.base.def,
    baseHp: t.base.hp,
    baseSpd: t.base.spd,
    skill: quality === 'normal' ? null : pick(Object.keys(PET_SKILLS)),
    alive: true
  };
  return pet;
}
function petStat(){
  if(!Game.pet) return { atk:0,def:0,hp:0,spd:0, pAtk:0,pDef:0,pSpd:0 };
  const p = Game.pet;
  const q = QUALITY[p.quality];
  const g = 1 + (p.lv-1)*0.18;
  const atk = Math.floor(p.baseAtk * q.mult * g);
  const def = Math.floor(p.baseDef * q.mult * g);
  const hp  = Math.floor(p.baseHp  * q.mult * g);
  const spd = Math.floor(p.baseSpd * q.mult * (1 + (p.lv-1)*0.08));
  // 被动：给玩家 +20% 属性
  const pAtk = Math.floor(atk * 0.2);
  const pDef = Math.floor(def * 0.2);
  const pSpd = Math.floor(spd * 0.2);
  return { atk, def, hp, spd, pAtk, pDef, pSpd };
}
function petSkillState(){
  const st = { crit:0, ls:0, group:false, heal:0 };
  if(!Game.pet || !Game.pet.skill) return st;
  const sk = PET_SKILLS[Game.pet.skill];
  if(sk && sk.apply) sk.apply(st);
  return st;
}
function petAddExp(v){
  if(!Game.pet) return;
  const p = Game.pet;
  p.exp += v;
  const need = () => p.lv * 150;
  while(p.exp >= need()){
    p.exp -= need();
    p.lv++;

const Save = {
  KEY: 'legend_bw_v3',
  pack(){
    return {
      v:3,
      player: Game.player, bag: Game.bag, worn: Game.worn,
      mat: Game.mat, areaState: Game.areaState, flags: Game.flags,
      quest: Game.quest, pet: Game.pet, stats: Game.stats, ui: Game.ui
    };
  },
  write(silent){
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.pack())); if(!silent) toast("已存档"); }
    catch(e){ toast("存档失败"); }
  },
  manual(){ this.write(false); },
  auto(){ this.write(true); },
  load(){
    const s = localStorage.getItem(this.KEY);
    if(!s) return toast("无存档");
    try{
      const d = JSON.parse(s);
      if(d.v !== 3) return toast("存档版本不符");
      Object.assign(Game, {
        player: d.player, bag: d.bag, worn: d.worn,
        mat: d.mat, areaState: d.areaState, flags: d.flags,
        quest: d.quest, pet: d.pet, stats: d.stats, ui: d.ui || { areaId:null, floorIdx:null },

    confirmBox("确定全部重置？此操作不可撤销。", ()=>{

/* ============================================================
 *  装备操作
 * ============================================================ */
const Equip = {
  wear(idx){
    const e = Game.bag[idx]; if(!e) return;
    const old = Game.worn[e.slot];
    Game.worn[e.slot] = e;
    Game.bag.splice(idx, 1);
    if(old) Game.bag.push(old);
    Quest.onWear(e.name);
    Save.auto();
    UI.openBag(); Render.top();
  },
  unwear(slot){
    const e = Game.worn[slot]; if(!e) return;
    if(Game.bag.length >= Game.player.bagMax) return toast("背包已满");
    Game.bag.push(e); Game.worn[slot] = null;
    Save.auto();
    UI.openWorn(); Render.top();
  },
  sell(idx){
    const e = Game.bag[idx]; if(!e) return;
    const price = Math.floor(EQUIP_BASE[e.name].sell * (1 + QUALITY[e.quality].rate*2) * (e.affix?1.3:1));
    Game.player.gold += price;
    Game.bag.splice(idx, 1);
    toast("出售 +" + price + " 金币");
    Quest.onBagChange();
    Save.auto();
    UI.openBag(); Render.top();
  },
  decompose(idx){
    const e = Game.bag[idx]; if(!e) return;
    Game.mat += DECOMP_MAT[e.quality];
    Game.bag.splice(idx, 1);
    toast("分解 +" + DECOMP_MAT[e.quality] + " 材料");
    Quest.onBagChange();
    Save.auto();
    UI.openBag(); Render.top();
  },
  autoBest(){
    const pool = Game.bag.slice();
    SLOT_ORDER.forEach(s=>{ if(Game.worn[s]) pool.push(Game.worn[s]); });
    SLOT_ORDER.forEach(s=>{
      const cands = pool.filter(e=>e.slot===s);
      if(cands.length === 0){ Game.worn[s] = null; return; }
      cands.sort((a,b)=>{
        const ta = equipStat(a), tb = equipStat(b);
        const sa = ta.atk*1.5 + ta.def*1.2 + ta.spd*2 + ta.hp*0.3;
        const sb = tb.atk*1.5 + tb.def*1.2 + tb.spd*2 + tb.hp*0.3;
        return sb - sa;
      });
      Game.worn[s] = cands[0];
    });
    const used = new Set(SLOT_ORDER.map(s=>Game.worn[s]).filter(Boolean).map(e=>e.uid));
    Game.bag = pool.filter(e=>!used.has(e.uid));
    while(Game.bag.length > Game.player.bagMax) Game.bag.pop();
    Save.auto();
    UI.openWorn(); Render.top();
    toast("已装备最强");
  },
  refineRisk(e){
    let risk = 0.12 + (e.refineAtk + e.refineDef + e.refineHp) * 0.004;
    return clamp(risk, 0, 0.9);
  },
  refine(idx){
    const e = Game.bag[idx]; if(!e) return;
    if(e.refineTimes >= 3) return toast("已达洗练上限");
    if(Game.mat < 1) return toast("缺少洗练材料");
    const risk = this.refineRisk(e);
    Game.mat -= 1;
    if(Math.random() < risk){
      e.refineAtk = 0; e.refineDef = 0; e.refineHp = 0;
      toast("💥 洗练破损，附加属性清零");
    }else{
      e.refineAtk += rnd(1,6);
      e.refineDef += rnd(1,4);
      if(Math.random() < 0.35) e.refineHp += rnd(2,12);
      e.refineTimes++;
      toast("洗练成功");
    }
    Save.auto();
    UI.openRefine(idx); Render.top();
  }
};

const Shop = {
  buyPotion(n){
    const cost = n * POTION_PRICE;
    if(Game.player.gold < cost) return toast("金币不足");
    Game.player.gold -= cost;
    Game.player.potion += n;
    toast(`购得红药 ×${n}`);
    Save.auto(); UI.openShop(); Render.top();
  },
  buyEquip(name){
    const b = EQUIP_BASE[name];
    if(Game.player.gold < b.buy) return toast("金币不足");
    if(Game.bag.length >= Game.player.bagMax) return toast("背包已满");
    Game.player.gold -= b.buy;
    Game.bag.push(makeEquip(name, 'normal'));
    Quest.onBagChange();
    toast("购买成功");
    Save.auto(); UI.openShop(); Render.top();
  },
  buyPetEgg(){
    if(Game.player.gold < 500) return toast("金币不足");
    Game.player.gold -= 500;
    const tpl = pick(Object.keys(PET_TEMPLATES));
    const q = Math.random() < 0.5 ? 'normal' : 'good';
    const pet = makePet(tpl, q);
    if(Game.pet) return toast("已有宠物，请先放生");
    Game.pet = pet;
    toast(`孵化出 ${pet.name} [${QUALITY[q].name}]`);
    Save.auto(); UI.openShop(); Render.top();

const Quest = {
  refreshPool(force){
    const now = Date.now();
    if(!force && now - Game.quest.refreshTs < QUEST_POOL_CD) return;
    Game.quest.refreshTs = now;
    Game.quest.avail = [];
    for(let i=0;i<5;i++) Game.quest.avail.push(this.gen());
  },
  cdLeft(){
    return Math.max(0, Math.ceil((Game.quest.refreshTs + QUEST_POOL_CD - Date.now()) / 1000));
  },
  gen(){
    const types = ['killMonster','collectItem','reachFloor','payGold','wearEquip'];
    const t = types[rnd(0, types.length-1)];
    const ar = AREAS[rnd(0, AREAS.length-1)];
    const fi = rnd(0, 2);
    const def = ar.floors[fi];
    const mon = pick(def.pool);
    const eqNames = Object.keys(EQUIP_BASE);
    const eqName = pick(eqNames);
    const q = {
      qid: uid(), type: t,
      targetId: mon.id, targetName: mon.name,
      areaId: ar.id, floorIdx: fi,
      equipName: eqName,
      needCount: rnd(2, 5),
      progress: 0, finished: false,
      goldReward: rnd(200, 600),
      expReward: rnd(300, 900)
    };
    if(t === 'reachFloor'){ q.needCount = 1; }
    if(t === 'wearEquip'){ q.needCount = 1; }
    return q;
  },
  desc(q){
    switch(q.type){
      case 'killMonster': return `击杀 ${q.needCount} 只「${q.targetName}」 (${q.progress}/${q.needCount})`;
      case 'collectItem': return `收集 ${q.needCount} 件「${q.equipName}」 (${q.progress}/${q.needCount})`;
      case 'reachFloor':  return `到达【${AREA_MAP[q.areaId].name}】第 ${q.floorIdx+1} 层 ${q.finished?'✔':''}`;
      case 'payGold':     return `上交 ${q.needCount*100} 金币 ${q.finished?'✔':''}`;
      case 'wearEquip':   return `穿戴装备「${q.equipName}」 ${q.finished?'✔':''}`;
    }
    return '';
  },
  accept(i){
    if(Game.quest.doing.length >= 3) return toast("最多同时接 3 个任务");
    const q = Game.quest.avail.splice(i, 1)[0];
    Game.quest.doing.push(q);
    if(q.type === 'reachFloor' && Game.ui.areaId === q.areaId && Game.ui.floorIdx === q.floorIdx) q.finished = true;
    if(q.type === 'collectItem') this.recheckCollect(q);
    if(q.type === 'wearEquip'){
      for(const s in Game.worn){
        if(Game.worn[s] && Game.worn[s].name === q.equipName){ q.finished = true; break; }
      }
    }
    Save.auto();
    UI.openQuest();
  },
  abandon(i){
    confirmBox("确定放弃该任务？", ()=>{
      Game.quest.doing.splice(i, 1);
      Save.auto(); UI.openQuest();
    });
  },
  claim(i){
    const q = Game.quest.doing[i]; if(!q || !q.finished) return;
    Game.player.gold += q.goldReward;
    addExp(q.expReward);
    Game.quest.doing.splice(i, 1);
    toast(`任务完成 +${q.goldReward} 金币`);
    Save.auto(); UI.openQuest(); Render.top();
  },
  payGold(i){
    const q = Game.quest.doing[i]; if(!q) return;
    const cost = q.needCount * 100;
    if(Game.player.gold < cost) return toast("金币不足");
    Game.player.gold -= cost;
    q.finished = true;
    Save.auto(); UI.openQuest(); Render.top();
  },
  onKill(protoId){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'killMonster' && q.targetId === protoId && !q.finished){
        q.progress++;
        if(q.progress >= q.needCount) q.finished = true;
        changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onReachFloor(areaId, fi){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'reachFloor' && q.areaId === areaId && q.floorIdx === fi && !q.finished){
        q.finished = true; changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onWear(eqName){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'wearEquip' && q.equipName === eqName && !q.finished){
        q.finished = true; changed = true;
      }
    });
    if(changed) Save.auto();
  },
  onBagChange(){
    let changed = false;
    Game.quest.doing.forEach(q=>{
      if(q.type === 'collectItem'){
        const before = q.progress;
        this.recheckCollect(q);
        if(q.progress !== before) changed = true;
      }
    });
    if(changed) Save.auto();
  },
  recheckCollect(q){
    let n = 0;
    Game.bag.forEach(e=>{ if(e.name === q.equipName) n++; });
    for(const s in Game.worn){ if(Game.worn[s] && Game.worn[s].name === q.equipName) n++; }
    q.progress = Math.min(n, q.needCount);
    if(q.progress >= q.needCount) q.finished = true;
  }
};

const Events = {
  maybeTrigger(){
    if(Math.random() > 0.15) return;
    const t = pick(['chest','trader','trap']);
    const p = Game.player;
    if(t === 'chest'){
      confirmBox("🎁 发现宝箱怪！是否挑战？", ()=>{
        // 直接给一件装备
        const name = pick(SHOP_LIST);
        const eq = makeEquip(name, rollQuality(0.1));
        if(Game.bag.length < p.bagMax){
          Game.bag.push(eq);
          Quest.onBagChange();
          toast(`宝箱获得 ${eq.name} [${QUALITY[eq.quality].name}]`);
        }else{
          toast("背包已满，宝箱丢失");
        }
        Save.auto();
      });
    }else if(t === 'trader'){
      confirmBox("🧙 遇到流浪商人：花 100 金币换 2 个洗练材料？", ()=>{
        if(p.gold < 100) return toast("金币不足");
        p.gold -= 100;
        Game.mat += 2;
        toast("交易成功");
        Render.top(); Save.auto();
      });
    }else if(t === 'trap'){
      const dmg = Math.floor(playerMaxHp() * 0.15);
      p.hp = Math.max(1, p.hp - dmg);
      toast(`⚠️ 触发陷阱，损失 ${dmg} HP`);
      Render.top(); Save.auto();
    }
  }
};

/* ============================================================
 *  战斗系统（群战 + 速度 + 宠物）
 * ============================================================ */
const Combat = {
  startGroup(gi){
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    const st = areaState(Game.ui.areaId).floors[fi];
    if(!st.spawned) spawnFloor(Game.ui.areaId, fi);
    const group = st.groups[gi];
    if(!group) return;
    if(group.members.every(m=>m.dead)) return toast("该组已清空");

    Game.battle = {
      kind: 'group',
      groupRef: group,
      gi: gi,
      monsters: group.members,
      boss: null,
      auto: false,
      pendingSkill: null,
      token: 0,
      roundCount: 0,
      buff: { zhanshen: 0 }
    };
    this._enter();
  },

  startBoss(){
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    const st = areaState(Game.ui.areaId).floors[fi];
    if(st.bossDeath) return toast("BOSS 未复活");
    const def = ar.floors[fi].boss;
    const boss = {
      mid: uid(),
      protoId: def.id,
      name: def.name,
      hp: def.hp, maxHp: def.hp,
      atk: def.atk, def: def.def, spd: def.spd,
      exp: def.exp, gMin: def.gMin, gMax: def.gMax,
      behavior: 'normal',
      elite: false,
      affixes: [],
      dead: false,
      deathTs: 0,
      vamp: 0, pois: 0,
      isBoss: true,
      dropEquip: def.dropEquip || null,
      unlockDragon: def.unlockDragon || false
    };
    Game.battle = {
      kind: 'boss',
      monsters: [boss],
      boss: boss,
      auto: false,
      pendingSkill: null,
      token: 0,
      roundCount: 0,
      buff: { zhanshen: 0 }
    };
    this._enter();
  },

  _enter(){
    const b = Game.battle;
    if(!b) return;
    // 玩家/宠物 存活检查
    if(Game.player.hp <= 0) Game.player.hp = playerMaxHp();
    $('battle').classList.remove('hidden');
    $('bLog').innerHTML = '';
    $('bField').innerHTML = '';
    // 顶部区域
    const ar = AREA_MAP[Game.ui.areaId];
    const fi = Game.ui.floorIdx;
    $('bLoc').textContent = b.kind === 'boss'
      ? `${ar.name} 第${fi+1}层 · BOSS`
      : `${ar.name} 第${fi+1}层 · 第${b.gi+1}组`;
    this.log('sys', b.kind === 'boss' ? `⚔️ 挑战 ${b.boss.name}` : `⚔️ 遭遇 ${b.monsters.length} 只怪物`);
    this.render();
    Save.auto();
  },

  render(){
    const b = Game.battle; if(!b) return;

    // 怪物列表
    const field = $('bField');
    field.innerHTML = '';
    b.monsters.forEach((m, i)=>{
      const div = document.createElement('div');
      div.className = 'mon-unit';
      if(m.dead) div.classList.add('dead');
      if(m.elite) div.classList.add('elite');
      if(m.isBoss) div.classList.add('boss');
      if(b.pendingSkill && !m.dead) div.classList.add('targetable');
      const hpP = clamp(m.hp/m.maxHp,0,1)*100;
      const affixStr = m.affixes && m.affixes.length
        ? m.affixes.map(k=>ELITE_AFFIXES.find(a=>a.k===k).name).join('·')
        : '';
      const bhv = MON_BEHAVIOR[m.behavior] ? MON_BEHAVIOR[m.behavior].name : '';
      div.innerHTML = `
        <div class="top">
          <span><span class="avatar">${m.isBoss?'👹':m.elite?'★':'🐾'}</span>${m.name}</span>
          <span class="dim">速${m.spd}</span>
        </div>
        <div class="bar mon"><i style="width:${hpP}%"></i><div class="txt">${Math.max(0,Math.floor(m.hp))}/${m.maxHp}</div></div>
        <div class="info">攻${m.atk} 防${m.def}${bhv?' · '+bhv:''}${affixStr?' · '+affixStr:''}</div>
      `;
      if(!m.dead){
        div.onclick = ()=>this.clickMonster(i);
      }
      field.appendChild(div);
    });

    // 玩家
    const a = calcAttr();
    const mHp = playerMaxHp();
    $('bLv').textContent = Game.player.lv;
    $('bMeHpBar').style.width = clamp(Game.player.hp/mHp,0,1)*100 + '%';
    $('bMeHpTxt').textContent = Math.floor(Game.player.hp) + '/' + mHp;
    $('bMeAtk').textContent = a.atk;
    $('bMeDef').textContent = a.def;
    $('bMeSpd').textContent = a.spd;
    $('bPotTip').textContent = Game.player.potion;
    $('bRageTip').textContent = Game.player.rage || 0;
    const buffTxt = [];
    if(b.buff.zhanshen > 0) buffTxt.push(`战神祝福(${b.buff.zhanshen})`);
    $('bBuffTip').textContent = buffTxt.join(' ');

    // 技能按钮
    this._refreshSkillBtn('bSkill1', 'liehuo');
    this._refreshSkillBtn('bSkill2', 'banyue');
    this._refreshSkillBtn('bSkill3', 'zhiyu');
    this._refreshSkillBtn('bSkill4', 'zhanshen');
    $('bRageBtn').disabled = (Game.player.rage || 0) < RAGE_MAX;
    $('bAutoBtn').textContent = b.auto ? '停止' : '自动';

    // 提示
    if(b.pendingSkill){
      const sk = SKILLS[b.pendingSkill];
      $('bTip').textContent = `请点击目标释放 ${sk.name}`;
    }else{
      $('bTip').textContent = b.auto ? '自动战斗中…' : '点击怪物发起攻击（按速度决定出手顺序）';
    }
  },

  _refreshSkillBtn(id, key){
    const sk = SKILLS[key];
    const btn = $(id);
    if(!btn) return;
    const b = Game.battle;
    const cd = b.cds ? (b.cds[key] || 0) : 0;
    if(Game.player.lv < sk.unlock){
      btn.textContent = `${sk.name}(Lv.${sk.unlock})`;
      btn.disabled = true;
    }else if(cd > 0){
      btn.textContent = `${sk.name}(${cd})`;
      btn.disabled = true;
    }else{
      btn.textContent = sk.name;
      btn.disabled = false;
    }
  },

  log(kind, text){
    const c = $('bLog');
    if(!c) return;
    const cls = { me:'l-me', mon:'l-mon', sys:'l-sys', good:'l-good', bad:'l-bad', pet:'l-pet' }[kind] || 'l-sys';
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
    while(c.children.length > 80) c.removeChild(c.firstChild);
  },

  /* ============ 玩家操作 ============ */
  attack(){
    const b = Game.battle; if(!b) return;
    if(b.pendingSkill) return;
    // 单体攻击需要目标：默认攻击血最少的
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;
    alive.sort((a,b)=>a.hp - b.hp);
    this._resolveRound({ type:'attack', target: alive[0] });
  },

  clickMonster(i){
    const b = Game.battle; if(!b) return;
    const m = b.monsters[i];
    if(!m || m.dead) return;
    if(b.pendingSkill){
      // 释放单体技能
      const skKey = b.pendingSkill;
      b.pendingSkill = null;
      this._resolveRound({ type:'skill', skill: skKey, target: m });
    }else{
      this._resolveRound({ type:'attack', target: m });
    }
  },

  useSkill(key){
    const b = Game.battle; if(!b) return;
    const sk = SKILLS[key]; if(!sk) return;
    if(Game.player.lv < sk.unlock) return toast(`需 Lv.${sk.unlock}`);
    if(b.cds && b.cds[key] > 0) return toast("冷却中");
    // 单体技能：进入等待目标模式
    if(key === 'liehuo'){
      b.pendingSkill = key;
      this.render();
      return;
    }
    // 群攻/自身技能直接结算
    this._resolveRound({ type:'skill', skill: key, target: null });
  },

  useRage(){
    const b = Game.battle; if(!b) return;
    if((Game.player.rage||0) < RAGE_MAX) return toast("怒气不足");
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;
    alive.sort((a,b)=>a.hp-b.hp);
    this._resolveRound({ type:'rage', target: alive[0] });
  },

  potion(){
    const b = Game.battle; if(!b) return;
    if(Game.player.potion <= 0) return toast("没有红药");
    Game.player.potion--;
    const mHp = playerMaxHp();
    const heal = Math.floor(mHp * 0.35);
    Game.player.hp = Math.min(mHp, Game.player.hp + heal);
    this.log('good', `喝红药恢复 ${heal} HP`);
    // 喝药消耗回合：怪物反击
    this._monsterPhaseOnly();
  },

  flee(){
    const b = Game.battle; if(!b) return;
    if(Math.random() < 0.45){
      this.log('sys', '逃跑成功！');
      this.stopAuto();
      setTimeout(()=>this.end(), 300);
    }else{
      this.log('bad', '逃跑失败！');
      this._monsterPhaseOnly();
    }
  },

  toggleAuto(){
    const b = Game.battle; if(!b) return;
    b.auto = !b.auto;
    this.render();
    if(b.auto) this._autoTick();
  },
  _autoTick(){
    const b = Game.battle; if(!b || !b.auto) return;
    clearTimeout(b._timer);
    b._timer = setTimeout(()=>{
      if(!Game.battle || !Game.battle.auto) return;
      const alive = Game.battle.monsters.filter(m=>!m.dead);
      if(alive.length === 0) return;
      // 血量低自动喝药
      const mHp = playerMaxHp();
      if(Game.player.potion > 0 && Game.player.hp/mHp < AUTO_POTION_THRESHOLD){
        this.potion();
      }else if((Game.player.rage||0) >= RAGE_MAX){
        this.useRage();
      }else if(Game.player.lv >= 3 && (!Game.battle.cds || Game.battle.cds.banyue === 0) && alive.length >= 2){
        this.useSkill('banyue');
      }else if(Game.player.lv >= 5 && (!Game.battle.cds || Game.battle.cds.zhiyu === 0) && Game.player.hp/mHp < 0.5){
        this.useSkill('zhiyu');
      }else if(Game.player.lv >= 8 && (!Game.battle.cds || Game.battle.cds.zhanshen === 0) && Game.battle.buff.zhanshen === 0){
        this.useSkill('zhanshen');
      }else if(Game.player.lv >= 1 && (!Game.battle.cds || Game.battle.cds.liehuo === 0)){
        this.useSkill('liehuo');
        // 单体技能会进入目标等待，自动处理
        if(Game.battle && Game.battle.pendingSkill){
          const t = Game.battle.monsters.filter(m=>!m.dead).sort((a,b)=>a.hp-b.hp)[0];
          if(t){ Game.battle.pendingSkill = null; this._resolveRound({type:'skill', skill:'liehuo', target:t}); }
        }
      }else{
        this.attack();
      }
      if(Game.battle && Game.battle.auto) this._autoTick();
    }, 500);
  },
  stopAuto(){
    const b = Game.battle;
    if(b){ b.auto = false; clearTimeout(b._timer); }
  },

  /* ============ 核心回合结算 ============ */
  _resolveRound(action){
    const b = Game.battle; if(!b) return;
    // 冷却
    if(!b.cds) b.cds = {};
    // 递减冷却（在新回合开始时递减，表示"本回合可用"）
    b.roundCount++;

    // 玩家行动前，先构建行动顺序
    const units = [];

    // 玩家属性
    const pa = calcAttr();
    let atkMul = 1, defMul = 1;
    if(b.buff.zhanshen > 0){ atkMul = 1.3; defMul = 1.3; }

    // 玩家单位
    units.push({ side:'me', spd: pa.spd, name:'你' });
    // 宠物
    if(Game.pet && Game.pet.alive !== false){
      const pst = petStat();
      units.push({ side:'pet', spd: pst.spd, name: Game.pet.name });
    }
    // 怪物
    b.monsters.forEach((m, i)=>{
      if(!m.dead) units.push({ side:'mon', spd: m.spd, m, mi: i });
    });
    // 按速度降序
    units.sort((a,b)=>b.spd - a.spd);

    // 执行
    let meActed = false;
    for(const u of units){
      if(!Game.battle) return; // 已退出
      if(u.side === 'me'){
        this._doPlayerAction(action, atkMul, defMul);
        meActed = true;
      }else if(u.side === 'pet'){
        this._doPetAction();
      }else{
        const m = u.m;
        if(m.dead) continue;
        this._doMonsterAction(m, defMul);
      }
      if(Game.player.hp <= 0) break;
      if(b.monsters.every(x=>x.dead)) break;
    }

    // 处理受伤后死亡
    if(Game.player.hp <= 0){ this._onPlayerDead(); return; }
    if(b.monsters.every(x=>x.dead)){ this._onGroupCleared(); return; }

    // buff 回合递减
    if(b.buff.zhanshen > 0) b.buff.zhanshen--;
    // 技能冷却递减
    for(const k in b.cds){ if(b.cds[k] > 0) b.cds[k]--; }

    this.render();
    this._autoPotCheck();
    Save.auto();
  },

  _monsterPhaseOnly(){
    // 玩家不做动作，仅怪物按速度攻击
    const b = Game.battle; if(!b) return;
    const defMul = b.buff.zhanshen > 0 ? 1.3 : 1.0;
    const order = b.monsters.filter(m=>!m.dead).sort((a,b)=>b.spd - a.spd);
    for(const m of order){
      if(!Game.battle) return;
      if(m.dead) continue;
      this._doMonsterAction(m, defMul);
      if(Game.player.hp <= 0) break;
    }
    if(Game.player.hp <= 0){ this._onPlayerDead(); return; }
    for(const k in b.cds){ if(b.cds[k] > 0) b.cds[k]--; }
    if(b.buff.zhanshen > 0) b.buff.zhanshen--;
    this.render();
    this._autoPotCheck();
  },

  _autoPotCheck(){
    const b = Game.battle;
    if(!b) return;
    if(b.auto && Game.player.potion > 0){
      const mHp = playerMaxHp();
      if(Game.player.hp / mHp < AUTO_POTION_THRESHOLD){
        // 自动战斗循环里会处理，这里不重复
      }
    }
  },

  _doPlayerAction(action, atkMul, defMul){
    const b = Game.battle; if(!b) return;
    const a = calcAttr();

    if(action.type === 'attack'){
      const t = action.target;
      if(!t || t.dead) return;
      let dmg = Math.max(1, Math.floor((a.atk * atkMul) - t.def));
      let crit = Math.random() < a.crit;
      if(crit) dmg = Math.floor(dmg * a.critD);
      t.hp -= dmg;
      this.log('me', `你攻击 ${t.name}，造成 ${dmg} 伤害${crit?'（暴击）':''}`);
      if(a.ls > 0){
        const heal = Math.floor(dmg * a.ls);
        if(heal > 0){
          Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
          this.log('me', `吸血回复 ${heal} HP`);
        }
      }
      // 怒气
      Game.player.rage = Math.min(RAGE_MAX, (Game.player.rage||0) + 1);
    }
    else if(action.type === 'skill'){
      const key = action.skill;
      const sk = SKILLS[key];
      if(!sk) return;
      if(Game.player.lv < sk.unlock) return;
      if(b.cds[key] > 0) return;
      b.cds[key] = sk.cd;
      if(key === 'liehuo'){
        const t = action.target;
        if(!t || t.dead) return;
        let dmg = Math.max(1, Math.floor((a.atk * atkMul * 1.8) - t.def));
        let crit = Math.random() < a.crit;
        if(crit) dmg = Math.floor(dmg * a.critD);
        t.hp -= dmg;
        this.log('me', `🔥 烈火剑法！对 ${t.name} 造成 ${dmg} 伤害${crit?'（暴击）':''}`);
        if(a.ls > 0){
          const heal = Math.floor(dmg * a.ls);
          Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
        }
      }
      else if(key === 'banyue'){
        const alive = b.monsters.filter(m=>!m.dead);
        this.log('me', `🌪 半月弯刀！对全体造成伤害`);
        alive.forEach(t=>{
          let dmg = Math.max(1, Math.floor((a.atk * atkMul * 0.9) - t.def));
          let crit = Math.random() < a.crit;
          if(crit) dmg = Math.floor(dmg * a.critD);
          t.hp -= dmg;
          this.log('me', `  对 ${t.name} 造成 ${dmg} 伤害${crit?'（暴击）':''}`);
        });
      }
      else if(key === 'zhiyu'){
        const mHp = playerMaxHp();
        const heal = Math.floor(mHp * 0.25);
        Game.player.hp = Math.min(mHp, Game.player.hp + heal);
        this.log('me', `💚 治愈术！恢复 ${heal} HP`);
      }
      else if(key === 'zhanshen'){
        b.buff.zhanshen = 3;
        this.log('me', `🛡 战神祝福！接下来 3 回合攻防 +30%`);
      }
      Game.player.rage = Math.min(RAGE_MAX, (Game.player.rage||0) + 1);
    }
    else if(action.type === 'rage'){
      const t = action.target;
      if(!t || t.dead) return;
      let dmg = Math.max(1, Math.floor((a.atk * atkMul * 3.0) - t.def * 0.3));
      let crit = Math.random() < a.crit;
      if(crit) dmg = Math.floor(dmg * a.critD);
      t.hp -= dmg;
      this.log('me', `💢 怒斩！无视防御对 ${t.name} 造成 ${dmg} 伤害${crit?'（暴击）':''}`);
      Game.player.rage = 0;
    }

    // 清理死亡
    if(t_die_check(b)) {}
    function t_die_check(){ return false; }
    b.monsters.forEach(m=>{
      if(m.hp <= 0 && !m.dead){ this._killMonster(m); }
    });
  },

  _doPetAction(){
    const b = Game.battle; if(!b) return;
    if(!Game.pet || Game.pet.alive === false) return;
    const pst = petStat();
    const ps = petSkillState();
    const alive = b.monsters.filter(m=>!m.dead);
    if(alive.length === 0) return;

    if(ps.heal){
      const mHp = playerMaxHp();
      const heal = Math.floor(mHp * ps.heal);
      Game.player.hp = Math.min(mHp, Game.player.hp + heal);
      this.log('pet', `${Game.pet.name} 守护主人，恢复 ${heal} HP`);
    }

    if(ps.group){
      this.log('pet', `${Game.pet.name} 释放撕咬！`);
      alive.forEach(t=>{
        let dmg = Math.max(1, Math.floor(pst.atk * 0.3 - t.def * 0.5));
        if(Math.random() < (0.12 + ps.crit)) dmg = Math.floor(dmg * 1.3);
        t.hp -= dmg;
        this.log('pet', `  对 ${t.name} 造成 ${dmg} 伤害`);
        if(ps.ls > 0){
          const heal = Math.floor(dmg * ps.ls);
          Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
        }
      });
    }else{
      const t = alive.sort((a,b)=>a.hp-b.hp)[0];
      let dmg = Math.max(1, Math.floor(pst.atk - t.def));
      let crit = Math.random() < (0.12 + ps.crit);
      if(crit) dmg = Math.floor(dmg * 1.3);
      t.hp -= dmg;
      this.log('pet', `${Game.pet.name} 攻击 ${t.name}，造成 ${dmg} 伤害${crit?'（暴击）':''}`);
      if(ps.ls > 0){
        const heal = Math.floor(dmg * ps.ls);
        Game.player.hp = Math.min(playerMaxHp(), Game.player.hp + heal);
      }
    }

    b.monsters.forEach(m=>{
      if(m.hp <= 0 && !m.dead) this._killMonster(m);
    });
  },

  _doMonsterAction(m, defMul){
    const b = Game.battle; if(!b) return;
    if(m.dead) return;
    // 治疗怪：优先治疗
    if(m.behavior === 'healer'){
      const allies = b.monsters.filter(x=>!x.dead && x !== m);
      if(allies.length > 0){
        const worst = allies.sort((a,b)=>a.hp/a.maxHp - b.hp/b.maxHp)[0];
        const heal = Math.floor(worst.maxHp * 0.15);
        worst.hp = Math.min(worst.maxHp, worst.hp + heal);
        this.log('mon', `${m.name} 治疗了 ${worst.name}，恢复 ${heal} HP`);
        return;
      }
    }
    // 召唤怪：每 2 回合召唤
    if(m.behavior === 'summon' && b.roundCount % 2 === 0){
      const aliveCount = b.monsters.filter(x=>!x.dead).length;
      if(aliveCount < 5){
        const tpl = {id:m.protoId+'_sum',name:'召唤小怪',hp:Math.floor(m.maxHp*0.3),atk:Math.floor(m.atk*0.5),def:Math.floor(m.def*0.5),spd:m.spd+2,exp:Math.floor(m.exp*0.2),gMin:1,gMax:5,behavior:'normal'};
        const nm = {
          mid: uid(), protoId: tpl.id, name: tpl.name,
          hp: tpl.hp, maxHp: tpl.hp, atk: tpl.atk, def: tpl.def, spd: tpl.spd,
          exp: tpl.exp, gMin: tpl.gMin, gMax: tpl.gMax, behavior:'normal',
          elite:false, affixes:[], dead:false, deathTs:0, vamp:0, pois:0
        };
        b.monsters.push(nm);
        this.log('mon', `${m.name} 召唤出 ${nm.name}！`);
      }
    }
    // 攻击：默认打玩家；远程优先打玩家（无视宠物，这里就是打玩家）
    // 狂暴：血量低于 50% 时攻击 +50%
    let atkVal = m.atk;
    if(m.behavior === 'rage' && m.hp / m.maxHp < 0.5) atkVal = Math.floor(atkVal * 1.5);
    const a = calcAttr();
    let dmg = Math.max(1, Math.floor(atkVal - a.def * defMul * 0.5 + a.def * 0.5 - a.def * 0.0));
    // 简化公式：怪物伤害 = max(1, atk - 玩家防御 * defMul/1.2)
    dmg = Math.max(1, Math.floor(atkVal - a.def * (defMul>1?1.3:1) * 0.9));
    let crit = Math.random() < 0.08;
    if(crit) dmg = Math.floor(dmg * 1.25);
    Game.player.hp -= dmg;
    this.log('mon', `${m.name} 攻击你，造成 ${dmg} 伤害${crit?'（暴击）':''}`);
    // 吸血词缀
    if(m.vamp){
      const heal = Math.floor(dmg * m.vamp);
      m.hp = Math.min(m.maxHp, m.hp + heal);
    }
    // 剧毒词缀：额外扣血（固定值）
    if(m.pois){
      Game.player.hp -= m.pois;
      this.log('mon', `  剧毒额外造成 ${m.pois} 伤害`);
    }
  },

  _killMonster(m){
    if(m.dead) return;
    m.dead = true;
    m.hp = 0;
    m.deathTs = Date.now();
    this.log('good', `✅ 击杀 ${m.name}`);
    Game.stats.kills++;
    // 金币
    const gold = rnd(m.gMin, m.gMax);
    Game.player.gold += gold;
    this.log('good', `  获得 ${gold} 金币`);
    // 经验
    addExp(m.exp);
    // 宠物经验
    if(Game.pet) petAddExp(Math.floor(m.exp * 0.5));
    // 任务
    Quest.onKill(m.protoId);
    // 掉落
    let dropChance = m.isBoss ? 0.85 : (m.elite ? 0.55 : 0.18);
    if(Math.random() < dropChance){
      const pool = ["木剑","铁剑","布帽","布衣","青铜戒指","木项链"];
      if(m.isBoss && m.dropEquip) pool.push(...m.dropEquip);
      const name = pick(pool);
      const boost = m.isBoss ? 0.15 : (m.elite ? 0.08 : 0);
      const eq = makeEquip(name, rollQuality(boost));
      if(Game.bag.length < Game.player.bagMax){
        Game.bag.push(eq);
        const q = QUALITY[eq.quality];
        this.log('good', `  ✨ 爆出【${eq.name} · ${q.name}】`);
        Quest.onBagChange();
      }else{
        this.log('bad', '  背包已满，装备丢失');
      }
    }
    // 精英掉宠物蛋
    if(m.elite && Math.random() < 0.08 && !Game.pet){
      const tpl = pick(Object.keys(PET_TEMPLATES));
      const q = pick(['good','fine','epic']);
      Game.pet = makePet(tpl, q);
      this.log('good', `  🥚 精英掉落宠物蛋！孵化出 ${Game.pet.name} [${QUALITY[q].name}]`);
    }
    // BOSS 掉宠物蛋
    if(m.isBoss){
      if(Math.random() < 0.25 && !Game.pet){
        const tpl = pick(Object.keys(PET_TEMPLATES));
        const q = pick(['fine','epic']);
        Game.pet = makePet(tpl, q);
        this.log('good', `  🥚 BOSS 掉落宠物蛋！孵化出 ${Game.pet.name} [${QUALITY[q].name}]`);
      }
      // BOSS 解锁魔龙城
      if(m.unlockDragon){
        Game.flags.dragonCity = true;
        this.log('good', '  🌐 魔龙城已解锁！');
      }
      const fi = Game.ui.floorIdx;
      areaState(Game.ui.areaId).floors[fi].bossDeath = Date.now();
    }
  },

  _onGroupCleared(){
    const b = Game.battle; if(!b) return;
    this.log('good', '🎉 怪物组已清空！');
    this.stopAuto();
    // 印记检查
    const st = areaState(Game.ui.areaId).floors[Game.ui.floorIdx];
    if(!st.mark && st.groups.every(g=>g.members.every(m=>m.dead))){
      st.mark = true;
      this.log('good', '🔓 本层印记点亮！');
    }
    Save.auto();
    setTimeout(()=>this.end(), 800);
  },

  _onPlayerDead(){
    this.log('bad', '💀 你死亡！损失 10% 金币');
    Game.player.gold = Math.floor(Game.player.gold * 0.9);
    Game.player.hp = playerMaxHp();
    Game.stats.deaths++;
    this.stopAuto();
    Save.auto();
    setTimeout(()=>this.end(), 900);
  },

  quit(){
    if(Game.battle && Game.battle.monsters.some(m=>!m.dead)){
      confirmBox("战斗尚未结束，确定退出？（视为逃跑失败）", ()=>{
        this.stopAuto();
        this.end();
      });
    }else{
      this.stopAuto();
      this.end();
    }
  },
  end(){
    this.stopAuto();
    Game.battle = null;
    $('battle').classList.add('hidden');
    Render.top();
    Render.main();
  }
};

/* ============================================================
 *  启动
 * ============================================================ */
initGame();
Render.top();
Render.main();
</script>
